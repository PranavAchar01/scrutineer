[project]
name = "scrutineer"
version = "0.1.0"
description = "SCRUTINEER — the optimizer: a bi-level self-improving agent team scored like a Formula 1 constructor."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "pynacl>=1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
rails = ["weave>=0.53", "wandb>=0.19", "openai>=1.50", "marimo>=0.13"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
scrutineer = "scrutineer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutineer"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
