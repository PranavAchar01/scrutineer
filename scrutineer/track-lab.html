<title>Scrutineer Track Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
html,body{background:#06081A;margin:0;color:#FFFFFF;font-family:"VT323","Courier New",monospace}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px;align-items:start;max-width:1400px;margin:0 auto}
@media (max-width:1100px){.lab{grid-template-columns:1fr}}
.left{display:flex;flex-direction:column;gap:12px;align-items:center}
.left header{font-family:"Press Start 2P","Courier New",monospace;font-size:14px;color:#FFFFFF;text-transform:uppercase}
.left header span{color:#F4C542}
.stage{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;border:4px solid #000;background:#06081A;overflow:hidden}
canvas#view{image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase}
.hud .tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.hud .tr{position:absolute;right:12px;top:12px;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud .bl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud .br{position:absolute;right:12px;bottom:12px}
.hud .tag{background:#000;color:#FFFFFF;padding:6px 8px;display:inline-block}
.hud .tag.red{background:#E31E2D}.hud .tag.gold{background:#F4C542;color:#000}.hud .tag.cyan{background:#3DD2FF;color:#000}.hud .tag.green{background:#2FD968;color:#000}.hud .tag.navy{background:#121A4A}
.hud .big{font-family:"VT323","Courier New",monospace;font-size:32px;line-height:24px;background:#000;padding:4px 8px;display:inline-block;color:#F4C542}
.hud .speed{display:flex;align-items:flex-end;gap:8px;background:#000;padding:6px 8px}
.hud .speed .n{font-family:"VT323","Courier New",monospace;font-size:32px;line-height:24px;color:#FFFFFF}
.hud .speed .bar{width:120px;height:8px;background:#121A4A;position:relative}
.hud .speed .bar i{position:absolute;left:0;top:0;bottom:0;background:#3DD2FF}
.hud .drs{background:#121A4A;color:#6A6F8A;padding:6px 8px}.hud .drs.on{background:#2FD968;color:#000}
canvas#map{image-rendering:pixelated;width:192px;height:128px;background:#000;display:block}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;background:#121A4A;color:#FFFFFF;border:2px solid #FFFFFF;padding:8px 10px;cursor:pointer}
button[aria-pressed="true"]{background:#F4C542;color:#000;border-color:#F4C542}
button:focus-visible{outline:2px solid #3DD2FF;outline-offset:2px}
button.small{padding:4px 6px;font-size:8px;min-width:26px}
.meta{font-size:22px;color:#C8CBD8}.meta b{color:#3DD2FF;font-weight:400}
.garage{width:340px;background:#000;border:4px solid #000;outline:2px solid #121A4A;padding:12px;display:flex;flex-direction:column;gap:10px;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase}
.garage h2{margin:0;font-size:10px;color:#F4C542;display:flex;justify-content:space-between}
.garage .pred{display:flex;justify-content:space-between;align-items:flex-end;background:#121A4A;padding:8px}
.garage .pred .v{font-family:"VT323","Courier New",monospace;font-size:32px;line-height:24px;color:#FFFFFF}
.garage .pred .d{font-family:"VT323","Courier New",monospace;font-size:24px;line-height:24px}
.garage .row{display:grid;grid-template-columns:1fr 84px 60px;align-items:center;gap:6px;border-bottom:1px dashed #121A4A;padding:4px 0}
.garage .row .val{font-family:"VT323","Courier New",monospace;font-size:22px;line-height:18px;color:#3DD2FF;text-align:right}
.garage .row .ctl{display:flex;gap:4px;justify-content:flex-end}
.garage .btns{display:flex;gap:6px;flex-wrap:wrap}
.garage .gens{max-height:180px;overflow-y:auto;font-family:"VT323","Courier New",monospace;font-size:20px;line-height:18px;text-transform:none}

.garage .stat div{background:#121A4A;padding:6px 4px;text-align:center}
.garage .stat b{display:block;font-family:"VT323","Courier New",monospace;font-size:22px;line-height:18px;color:#FFFFFF;font-weight:400}
.pos{color:#E31E2D}.neg{color:#2FD968}
</style>

// =====================================================================================

function sphere(cx, cy, cz, r, lat, lon, m, visor) {

    for (let j = 0; j < lon; j++) { const t0 = (j / lon) * Math.PI * 2, t1 = ((j + 1) / lon) * Math.PI * 2;
      const v = (p, t) => [cx + r * Math.sin(p) * Math.sin(t), cy + r * Math.cos(p), cz + r * Math.sin(p) * Math.cos(t)];
      const isVisor = visor && i >= 2 && i <= 3 && Math.cos((t0 + t1) / 2) > 0.35;
      Q(v(p0, t0), v(p1, t0), v(p1, t1), v(p0, t1), isVisor ? M.CYAN : m); } }

function wingElement(o) {
  const segs = o.segs || 6, spoon = o.spoon || (() => 0), c = o.chord, a = o.aoa, th = o.thick;
  const prof = y => [[o.zLE, y], [o.zLE - c * 0.45, y + c * 0.45 * Math.tan(a * 0.55)], [o.zLE - c, y + c * Math.tan(a)]];
  for (let i = 0; i < segs; i++) {

function wheel(cx, cy, cz, r, w, n, band) {

// =====================================================================================
const WB_F = 1.72, WB_R = -1.88, TRACK = 0.86, R_F = 0.355, R_R = 0.365;

const GEN01 = { frontWing: 2, rearWing: 2, floor: 1, sidepods: 'STD', fin: false, engine: 2, brakes: 2, tyres: 'MEDIUM', drs: false, ballast: 2, gearbox: 6 };
