<div class="lab">

  <div class="meta"><b>TRIS</b> <span id="tris">0</span> · <b>FRAME</b> <span id="ms">0</span>ms · <b>RES</b> 288x162 x4 · <b>SHADING</b> 8x8 BAYER · 4-STEP RAMPS</div>
</div>
<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 288, H = 162, SCALE = 4;
const BAYER = [
  0,32,8,40,2,34,10,42, 48,16,56,24,50,18,58,26, 12,44,4,36,14,46,6,38, 60,28,52,20,62,30,54,22,
  3,35,11,43,1,33,9,41, 51,19,59,27,49,17,57,25, 15,47,7,39,13,45,5,37, 63,31,55,23,61,29,53,21];
const bayer = (x, y) => (BAYER[((y & 7) << 3) | (x & 7)] + 0.5) / 64;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const P = { NIGHT:'#06081A', STUDIO:'#121A4A', TARMAC:'#2C2E3A', GRAVEL:'#8C7B58', INK:'#000000', WHITE:'#FFFFFF',
  CAPTION:'#C8CBD8', MIDGREY:'#6A6F8A', GOLD:'#F4C542', RED:'#E31E2D', CYAN:'#3DD2FF', GREEN:'#2FD968', AMBER:'#FFA318' };
// 4-step ramps: dark, mid, base, light. Shading picks a step, Bayer dithers between steps.
const RAMP = {
  BODY:   ['#6A6F8A', '#C8CBD8', '#FFFFFF', '#FFFFFF'],
  STRIPE: ['#5E0C13', '#A5161F', '#E31E2D', '#FF5A63'],
  CARBON: ['#000000', '#14161E', '#2C2E3A', '#474A5A'],
  TYRE:   ['#000000', '#0B0B10', '#1A1A22', '#2C2E3A'],
  RIM:    ['#2C2E3A', '#6A6F8A', '#C8CBD8', '#FFFFFF'],
  GOLD:   ['#7A5F14', '#B8922C', '#F4C542', '#FFE08A'],
  CYAN:   ['#0E4A5E', '#1F8FB0', '#3DD2FF', '#B8F0FF'],
  BAND:   ['#7A5F14', '#B8922C', '#F4C542', '#FFE08A'],
  FLOOR_A:['#000000', '#14161E', '#2C2E3A', '#474A5A'],
  FLOOR_B:['#000000', '#101219', '#22242E', '#3A3D4A'],
  LINE:   ['#7A5F14', '#B8922C', '#F4C542', '#FFE08A'],
  LAMP:   ['#B8F0FF', '#FFFFFF', '#FFFFFF', '#FFFFFF'],
};
const MAT_NAMES = Object.keys(RAMP);
const RAMPS = MAT_NAMES.map(k => RAMP[k].map(hex));
const M = {}; MAT_NAMES.forEach((k, i) => M[k] = i);
const FLOOR_MATS = new Set([M.FLOOR_A, M.FLOOR_B, M.LINE]);
const SHADOW_MAT = 200;

// ---------- mesh construction (model space: x right, y up, z forward/nose) ----------
const tris = []; // {v:[[x,y,z]x3], m, g}  g = group: 0 body, 1 FL, 2 FR, 3 RL, 4 RR
let group = 0;
const T = (a, b, c, m) => tris.push({ v: [a, b, c], m, g: group });
const Q = (a, b, c, d, m) => { T(a, b, c, m); T(a, c, d, m); };
// ring order: 0 (x-,y-) 1 (x+,y-) 2 (x+,y+) 3 (x-,y+) at a given z; front ring at zF (larger z), back ring at zB
function prism(zF, f, zB, b, m, opts = {}) {
  const F = [[f.cx - f.w / 2, f.cy - f.h / 2, zF], [f.cx + f.w / 2, f.cy - f.h / 2, zF], [f.cx + f.w / 2, f.cy + f.h / 2, zF], [f.cx - f.w / 2, f.cy + f.h / 2, zF]];
  const B = [[b.cx - b.w / 2, b.cy - b.h / 2, zB], [b.cx + b.w / 2, b.cy - b.h / 2, zB], [b.cx + b.w / 2, b.cy + b.h / 2, zB], [b.cx - b.w / 2, b.cy + b.h / 2, zB]];
  const mt = opts.top ?? m, mb = opts.bottom ?? m, ms = opts.side ?? m;
  Q(F[0], F[1], F[2], F[3], opts.front ?? m);      // front (+z)
  Q(B[1], B[0], B[3], B[2], opts.back ?? m);       // back (-z)
  Q(F[3], F[2], B[2], B[3], mt);                   // top (+y)
  Q(F[1], F[0], B[0], B[1], mb);                   // bottom (-y)
  Q(F[1], B[1], B[2], F[2], ms);                   // right (+x)
  Q(B[0], F[0], F[3], B[3], ms);                   // left (-x)
}
const box = (cx, cy, cz, w, h, d, m, opts) => prism(cz + d / 2, { cx, cy, w, h }, cz - d / 2, { cx, cy, w, h }, m, opts);
// cylinder along X axis (wheel): center (cx,cy,cz), radius r, width w, n segments
function cylX(cx, cy, cz, r, w, n, mSide, mCap, band) {
  const x0 = cx - w / 2, x1 = cx + w / 2;
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
    const y0 = cy + Math.cos(a0) * r, z0 = cz + Math.sin(a0) * r, y1 = cy + Math.cos(a1) * r, z1 = cz + Math.sin(a1) * r;
    Q([x0, y0, z0], [x0, y1, z1], [x1, y1, z1], [x1, y0, z0], mSide);
    if (band) {  // compound stripe: painted annulus on each sidewall
      const ra = r * 0.86, rb2 = r * 0.76, eb = 0.003;
      const A0 = [cy + Math.cos(a0) * ra, cz + Math.sin(a0) * ra], A1 = [cy + Math.cos(a1) * ra, cz + Math.sin(a1) * ra];
      const B0 = [cy + Math.cos(a0) * rb2, cz + Math.sin(a0) * rb2], B1 = [cy + Math.cos(a1) * rb2, cz + Math.sin(a1) * rb2];
      Q([x1 + eb, B0[0], B0[1]], [x1 + eb, A0[0], A0[1]], [x1 + eb, A1[0], A1[1]], [x1 + eb, B1[0], B1[1]], band);
      Q([x0 - eb, B0[0], B0[1]], [x0 - eb, B1[0], B1[1]], [x0 - eb, A1[0], A1[1]], [x0 - eb, A0[0], A0[1]], band);
    }
    // caps: outer annulus tyre, inner disc rim, hub
    T([x1, cy, cz], [x1, y0, z0], [x1, y1, z1], mSide);
    T([x0, cy, cz], [x0, y1, z1], [x0, y0, z0], mSide);
    const ri = r * 0.64, e = 0.004;
    const yi0 = cy + Math.cos(a0) * ri, zi0 = cz + Math.sin(a0) * ri, yi1 = cy + Math.cos(a1) * ri, zi1 = cz + Math.sin(a1) * ri;
    T([x1 + e, cy, cz], [x1 + e, yi0, zi0], [x1 + e, yi1, zi1], mCap);
    T([x0 - e, cy, cz], [x0 - e, yi1, zi1], [x0 - e, yi0, zi0], mCap);
    const rh = r * 0.18, yh0 = cy + Math.cos(a0) * rh, zh0 = cz + Math.sin(a0) * rh, yh1 = cy + Math.cos(a1) * rh, zh1 = cz + Math.sin(a1) * rh;
    T([x1 + 2 * e, cy, cz], [x1 + 2 * e, yh0, zh0], [x1 + 2 * e, yh1, zh1], M.GOLD);
    T([x0 - 2 * e, cy, cz], [x0 - 2 * e, yh1, zh1], [x0 - 2 * e, yh0, zh0], M.GOLD);
  }
}
function sphere(cx, cy, cz, r, lat, lon, m, visor) {
  for (let i = 0; i < lat; i++) {
    const p0 = (i / lat) * Math.PI, p1 = ((i + 1) / lat) * Math.PI;
    for (let j = 0; j < lon; j++) {
      const t0 = (j / lon) * Math.PI * 2, t1 = ((j + 1) / lon) * Math.PI * 2;
      const v = (p, t) => [cx + r * Math.sin(p) * Math.sin(t), cy + r * Math.cos(p), cz + r * Math.sin(p) * Math.cos(t)];
      const isVisor = visor && i >= 2 && i <= 3 && Math.cos((t0 + t1) / 2) > 0.35;
      Q(v(p0, t0), v(p1, t0), v(p1, t1), v(p0, t1), isVisor ? M.CYAN : m);
    }
  }
}

// ----- lofted octagonal sections (rounded body work) -----
function ring(z, sec) {
  // 8-point chamfered rectangle: w x h centred (cx,cy), chamfer fraction ch of the half-size
  const hw = sec.w / 2, hh = sec.h / 2, ch = sec.ch ?? 0.38, cw = hw * ch, chh = hh * ch, cx = sec.cx ?? 0, cy = sec.cy;
  return [[cx - hw + cw, cy - hh, z], [cx + hw - cw, cy - hh, z], [cx + hw, cy - hh + chh, z], [cx + hw, cy + hh - chh, z],
          [cx + hw - cw, cy + hh, z], [cx - hw + cw, cy + hh, z], [cx - hw, cy + hh - chh, z], [cx - hw, cy - hh + chh, z]];
}
function loft(sections, m, opts = {}) {
  // sections ordered nose (largest z) -> tail. top faces (indices 4,5 edge) may take a different material.
  const rings = sections.map(s => ring(s.z, s));
  for (let i = 0; i < rings.length - 1; i++) {
    const A = rings[i], B = rings[i + 1];
    for (let k = 0; k < 8; k++) {
      const k2 = (k + 1) % 8;
      const mat = (opts.top !== undefined && k === 4) ? opts.top : (opts.bottom !== undefined && k === 0) ? opts.bottom : m;
      Q(A[k], B[k], B[k2], A[k2], mat);
    }
  }
  // caps
  const F = rings[0], Bk = rings[rings.length - 1];
  for (let k = 1; k < 7; k++) { T(F[0], F[k], F[k + 1], opts.front ?? m); T(Bk[0], Bk[k + 1], Bk[k], opts.back ?? m); }
}
// 5x7 pixel digits for the race number decals
const DIGITS = { '2': ['01110', '10001', '00001', '00110', '01000', '10000', '11111'], '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
  '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'], '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
  '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'], '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'] };
function decal(text, side, x, y, z, cell, m) {
  // painted on the flank facing +x (side=1) or -x (side=-1); text reads left->right in the direction of travel
  let col = 0;
  for (const chd of text) {
    const rows = DIGITS[chd]; if (!rows) continue;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (rows[r][c] === '1') {
      const zz = z - side * (col * 6 + c) * cell, yy = y - r * cell;
      box(x, yy, zz, 0.012, cell, cell, m);
    }
    col++;
  }
}

// ----- the car (Gen 22 spec, metres) -----
const WB_F = 1.72, WB_R = -1.88, TRACK = 0.86, R_F = 0.355, R_R = 0.365;
group = 0;
// floor + plank
prism(1.6, { cx: 0, cy: 0.045, w: 0.8, h: 0.05 }, -2.05, { cx: 0, cy: 0.045, w: 1.5, h: 0.05 }, M.CARBON);
box(0, 0.02, -0.5, 1.62, 0.03, 2.4, M.CARBON);
// nose -> monocoque -> gearbox: one lofted spine
loft([
  { z: 2.9, cy: 0.27, w: 0.1, h: 0.09, ch: 0.5 }, { z: 2.55, cy: 0.29, w: 0.2, h: 0.15 }, { z: 2.1, cy: 0.34, w: 0.32, h: 0.24 },
  { z: 1.55, cy: 0.42, w: 0.48, h: 0.36 }, { z: 1.05, cy: 0.47, w: 0.66, h: 0.48 }, { z: 0.35, cy: 0.5, w: 0.72, h: 0.54 },
  { z: -0.5, cy: 0.5, w: 0.68, h: 0.52 }, { z: -1.2, cy: 0.45, w: 0.5, h: 0.42 }, { z: -1.85, cy: 0.4, w: 0.32, h: 0.32 },
  { z: -2.2, cy: 0.42, w: 0.2, h: 0.2 }], M.BODY, { top: M.STRIPE });
// engine cover + airbox, lofted on top of the spine
loft([
  { z: 0.42, cy: 0.9, w: 0.26, h: 0.26 }, { z: 0.05, cy: 0.9, w: 0.36, h: 0.4 }, { z: -0.45, cy: 0.82, w: 0.4, h: 0.52 },
  { z: -1.05, cy: 0.68, w: 0.32, h: 0.42 }, { z: -1.6, cy: 0.56, w: 0.2, h: 0.26 }, { z: -1.95, cy: 0.5, w: 0.1, h: 0.12 }], M.BODY, { top: M.STRIPE, front: M.CARBON });
prism(-0.55, { cx: 0, cy: 0.98, w: 0.03, h: 0.3 }, -1.9, { cx: 0, cy: 0.72, w: 0.03, h: 0.44 }, M.STRIPE);   // shark fin
box(0, 0.6, -1.55, 0.26, 0.1, 0.05, M.GOLD);                                                                   // gen badge
// sidepods: lofted, coke-bottle to the rear, inlet mouth in carbon
for (const s of [-1, 1]) {
  loft([
    { z: 0.78, cx: s * 0.64, cy: 0.33, w: 0.5, h: 0.46, ch: 0.3 }, { z: 0.25, cx: s * 0.66, cy: 0.34, w: 0.56, h: 0.5, ch: 0.3 },
    { z: -0.55, cx: s * 0.62, cy: 0.32, w: 0.5, h: 0.44 }, { z: -1.25, cx: s * 0.48, cy: 0.27, w: 0.3, h: 0.3 },
    { z: -1.8, cx: s * 0.38, cy: 0.23, w: 0.14, h: 0.16 }], M.BODY, { front: M.CARBON });
  box(s * 0.64, 0.36, 0.8, 0.44, 0.34, 0.05, M.CARBON);                    // inlet
  box(s * 0.92, 0.545, 0.0, 0.03, 0.02, 1.1, M.GOLD);                       // gold pinstripe along the outer shoulder
  box(s * 0.55, 0.22, 1.2, 0.03, 0.36, 0.5, M.CARBON);                      // bargeboard
  box(s * 0.7, 0.1, 1.0, 0.3, 0.02, 0.7, M.CARBON);                         // floor edge wing
  decal('22', s, s * 0.93, 0.5, 0.22, 0.034, M.CARBON);                     // race number on the flank
  box(s * 0.48, 0.74, 0.78, 0.08, 0.06, 0.1, M.CARBON);                     // mirror stalk
  box(s * 0.5, 0.8, 0.82, 0.18, 0.1, 0.05, M.CYAN);                         // mirror glass
}
// cockpit surround + dash
box(0, 0.76, 0.3, 0.44, 0.05, 0.62, M.CARBON);
box(0, 0.66, 0.92, 0.5, 0.2, 0.28, M.BODY, { top: M.STRIPE });
box(0, 0.7, 0.05, 0.3, 0.12, 0.3, M.STRIPE);                                // shoulders / HANS
sphere(0, 0.88, 0.24, 0.155, 6, 10, M.GOLD, true);                          // helmet + visor
// halo: 24-segment arc
for (let i = 0; i <= 24; i++) {
  const u = i / 24, ang = u * Math.PI;
  const x = Math.cos(ang) * 0.42, z = -0.28 + Math.sin(ang) * 1.05, y = 0.8 + Math.sin(ang) * 0.22;
  box(x, y, z, 0.065, 0.065, 0.09, M.CARBON);
}
box(0, 0.88, 0.73, 0.05, 0.3, 0.05, M.CARBON);
// front wing: mainplane + flap + endplates + pylons
box(0, 0.075, 2.62, 2.16, 0.035, 0.44, M.CARBON, { top: M.BODY });
box(0, 0.145, 2.46, 1.84, 0.035, 0.22, M.STRIPE);
box(0, 0.2, 2.34, 1.5, 0.03, 0.14, M.CARBON, { top: M.BODY });
for (const s of [-1, 1]) {
  box(s * 1.08, 0.17, 2.56, 0.035, 0.28, 0.6, M.CARBON, { side: M.BODY });
  box(s * 0.12, 0.17, 2.6, 0.05, 0.16, 0.24, M.CARBON);
}
// rear wing: two elements, endplates, swan-neck mounts, DRS pod
box(0, 0.86, -2.38, 1.02, 0.04, 0.34, M.CARBON, { top: M.BODY });
box(0, 0.99, -2.52, 1.02, 0.04, 0.2, M.STRIPE);
for (const s of [-1, 1]) box(s * 0.51, 0.78, -2.38, 0.035, 0.52, 0.58, M.CARBON, { side: M.BODY });
box(0, 0.7, -2.22, 0.08, 0.32, 0.12, M.CARBON);
box(0, 1.04, -2.44, 0.1, 0.06, 0.1, M.GOLD);
// beam wing + diffuser + rain light + exhaust
box(0, 0.42, -2.32, 0.92, 0.03, 0.14, M.CARBON);
prism(-1.6, { cx: 0, cy: 0.14, w: 0.9, h: 0.16 }, -2.28, { cx: 0, cy: 0.3, w: 1.12, h: 0.42 }, M.CARBON);
box(0, 0.58, -2.3, 0.1, 0.12, 0.05, M.STRIPE);
box(0, 0.5, -2.08, 0.09, 0.09, 0.2, M.CARBON);
// antenna + T-cam
box(0, 1.08, 0.3, 0.02, 0.24, 0.02, M.CYAN);
box(0, 1.19, 0.1, 0.12, 0.1, 0.16, M.CARBON, { front: M.CYAN });
// suspension
for (const s of [-1, 1]) {
  box(s * 0.55, 0.38, 1.86, 0.5, 0.03, 0.06, M.CARBON); box(s * 0.55, 0.38, 1.56, 0.5, 0.03, 0.06, M.CARBON);
  box(s * 0.55, 0.2, WB_F, 0.5, 0.03, 0.05, M.CARBON);
  box(s * 0.5, 0.42, -1.76, 0.5, 0.03, 0.06, M.CARBON); box(s * 0.5, 0.42, -2.0, 0.5, 0.03, 0.06, M.CARBON);
  box(s * 0.5, 0.22, WB_R, 0.5, 0.03, 0.05, M.CARBON);
  box(s * 0.62, 0.36, WB_F, 0.16, 0.2, 0.2, M.CARBON);   // front brake duct
  box(s * 0.6, 0.36, WB_R, 0.16, 0.22, 0.24, M.CARBON);  // rear brake duct
}
// wheels: groups 1..4
const WHEELS = [
  { g: 1, cx: -TRACK, cz: WB_F, r: R_F, w: 0.33, front: true }, { g: 2, cx: TRACK, cz: WB_F, r: R_F, w: 0.33, front: true },
  { g: 3, cx: -TRACK, cz: WB_R, r: R_R, w: 0.42, front: false }, { g: 4, cx: TRACK, cz: WB_R, r: R_R, w: 0.42, front: false }];
for (const wdef of WHEELS) { group = wdef.g; cylX(wdef.cx, wdef.r, wdef.cz, wdef.r, wdef.w, 16, M.TYRE, M.RIM, M.BAND); }
group = 0;
const CAR_TRIS = tris.length;

// ----- garage floor (temporary lab stage): tiles + bay lines + lamps -----
const floorTris = [];
{
  const save = tris.length;
  const N = 14, S = 0.9;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x0 = (i - N / 2) * S, z0 = (j - N / 2) * S;
    const m = ((i + j) & 1) ? M.FLOOR_A : M.FLOOR_B;
    Q([x0, 0, z0 + S], [x0 + S, 0, z0 + S], [x0 + S, 0, z0], [x0, 0, z0], m);
  }
  box(0, 0.004, 0, 3.4, 0.006, 0.05, M.LINE); box(0, 0.004, 0, 0.05, 0.006, 6.8, M.LINE);
  box(0, 0.004, 3.4, 3.4, 0.006, 0.08, M.LINE); box(0, 0.004, -3.4, 3.4, 0.006, 0.08, M.LINE);
  box(1.7, 0.004, 0, 0.08, 0.006, 6.8, M.LINE); box(-1.7, 0.004, 0, 0.08, 0.006, 6.8, M.LINE);
  floorTris.push(...tris.splice(save));
}

// ----- flatten -----
function flatten(list) {
  const pos = new Float32Array(list.length * 9), mat = new Uint8Array(list.length), grp = new Uint8Array(list.length);
  list.forEach((t, i) => { for (let k = 0; k < 3; k++) { pos[i * 9 + k * 3] = t.v[k][0]; pos[i * 9 + k * 3 + 1] = t.v[k][1]; pos[i * 9 + k * 3 + 2] = t.v[k][2]; } mat[i] = t.m; grp[i] = t.g; });
  return { pos, mat, grp, n: list.length };
}
const CAR = flatten(tris), FLOOR = flatten(floorTris);

// ---------- software rasterizer ----------
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d', { alpha: false });
const img = octx.createImageData(W, H), px = img.data;
const depth = new Float32Array(W * H), matBuf = new Int16Array(W * H);
const view = document.getElementById('view'); view.width = W * SCALE; view.height = H * SCALE;
