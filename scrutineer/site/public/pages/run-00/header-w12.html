<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #333;
      background-color: #fff;
    }

    body {
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
    }

    .site-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-right: 2rem;
    }

    nav {
      flex: 1;
      display: flex;
      justify-content: center;
      margin: 0 2rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      display: inline-block;
    }

    nav ul li a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    .search-container {
      flex: 1;
      display: flex;
      justify-content: center;
      margin: 0 2rem;
    }

    .search-container input[type="search"] {
      padding: 0.5rem;
      width: 100%;
      max-width: 300px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-menu button {
      padding: 0.5rem 1rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .user-menu button:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      nav {
        flex: 0 0 100%;
        justify-content: flex-start;
        margin: 0;
      }

      .search-container {
        flex: 0 0 100%;
        justify-content: flex-start;
        margin: 0;
      }

      .user-menu {
        flex: 0 0 100%;
        justify-content: flex-start;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="site-title">MyWebsite</div>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <div class="search-container">
      <form role="search">
        <input type="search" aria-label="Search" placeholder="Search..." />
      </form>
    </div>
    <div class="user-menu">
      <button aria-label="User Menu">Account</button>
    </div>
  </header>
</body>
</html>
