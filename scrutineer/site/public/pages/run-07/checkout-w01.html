<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #007bff;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      background-color: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    input:focus, select:focus, button:focus {
      outline: 2px solid #007bff;
      outline-offset: 2px;
    }

    button {
      margin-top: 1.5rem;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .total {
      margin-top: 2rem;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: right;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #e9ecef;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Checkout</h1>
  </header>
  <main>
    <form>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required aria-label="Email Address" />

      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" name="card-number" required aria-label="Card Number" />

      <label for="expiry">Expiry Date (MM/YY)</label>
      <input type="text" id="expiry" name="expiry" required aria-label="Expiry Date (MM/YY)" />

      <label for="cvc">CVC</label>
      <input type="text" id="cvc" name="cvc" required aria-label="CVC" />

      <label for="country">Country</label>
      <select id="country" name="country" required aria-label="Country">
        <option value="">Select a country</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="UK">United Kingdom</option>
        <option value="AU">Australia</option>
      </select>

      <button type="submit">Pay</button>
    </form>
    <div class="total">Order Total: $125.00</div>
  </main>
  <footer>
    <p>&copy; 2025 Checkout Example. All rights reserved.</p>
  </footer>
</body>
</html>
