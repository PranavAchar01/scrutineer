<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Form - Step 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #007BFF;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    nav {
      background-color: #e0e0e0;
      padding: 0.5rem;
      text-align: center;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #007BFF;
    }

    main {
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      background-color: white;
    }

    h1 {
      margin-top: 0;
    }

    .progress {
      margin-bottom: 1rem;
    }

    .progress-step {
      display: inline-block;
      width: 30px;
      height: 30px;
      background-color: #ccc;
      border-radius: 50%;
      color: white;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      margin-right: 10px;
    }

    .progress-step.completed {
      background-color: #28a745;
    }

    .progress-step.current {
      background-color: #007BFF;
    }

    .progress-line {
      display: inline-block;
      height: 5px;
      background-color: #ccc;
      margin: 0 10px;
    }

    .progress-line.completed {
      background-color: #28a745;
    }

    label {
      display: block;
      margin-top: 1.5rem;
      font-weight: bold;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .button-group {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      justify-content: space-between;
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button.back {
      background-color: #dc3545;
      color: white;
    }

    button.continue {
      background-color: #007BFF;
      color: white;
    }

    footer {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Booking Form</h1>
  </header>

  <nav aria-label="Main navigation">
    <a href="#">Step 1</a>
    <a href="#">Step 2</a>
    <a href="#">Step 3</a>
  </nav>

  <main>
    <div class="progress">
      <div class="progress-step completed" aria-label="Step 1 completed">1</div>
      <div class="progress-line completed"></div>
      <div class="progress-step current" aria-label="Step 2 current">2</div>
      <div class="progress-line"></div>
      <div class="progress-step" aria-label="Step 3 not started">3</div>
    </div>

    <h2>Step 2: Contact Information</h2>
    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" aria-required="true" aria-label="Full Name">

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" aria-required="true" aria-label="Email Address">
    </form>

    <div class="button-group">
      <button class="back" type="button" aria-label="Go back to Step 1">Back</button>
      <button class="continue" type="button" aria-label="Continue to Step 3">Continue</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Booking Form. All rights reserved.</p>
  </footer>
</body>
</html>
