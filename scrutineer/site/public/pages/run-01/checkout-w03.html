<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Form</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }

    header, footer {
      background: #005792;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      font-size: 1rem;
      box-sizing: border-box;
    }

    button {
      margin-top: 1rem;
      background: #005792;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #00406a;
    }

    .total {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      main {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Checkout</h1>
  </header>

  <main>
    <h2>Order Total</h2>
    <div class="total">$59.99</div>

    <form>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required aria-required="true" aria-label="Email address" />

      <label for="card-number">Card number</label>
      <input type="text" id="card-number" name="card-number" required aria-required="true" aria-label="Card number" />

      <label for="expiry">Card expiry</label>
      <input type="text" id="expiry" name="expiry" required aria-required="true" aria-label="Card expiry (MM/YY)" />

      <label for="cvc">Card CVC</label>
      <input type="text" id="cvc" name="cvc" required aria-required="true" aria-label="Card CVC" />

      <label for="country">Country</label>
      <select id="country" name="country" required aria-required="true" aria-label="Country">
        <option value="">Select a country</option>
        <option value="US">United States</option>
        <option value="CA">Canada</option>
        <option value="UK">United Kingdom</option>
        <option value="AU">Australia</option>
      </select>

      <button type="submit">Pay</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Checkout Form</p>
  </footer>
</body>
</html>
