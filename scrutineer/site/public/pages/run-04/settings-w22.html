<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #333;
    }

    header {
      background-color: #333;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    main {
      padding: 2rem;
      max-width: 400px;
      margin: auto;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    .setting {
      display: flex;
      align-items: center;
      margin-bottom: 1rem;
    }

    .setting label {
      flex: 1;
      margin-right: 1rem;
    }

    .setting input[type="checkbox"] {
      transform: scale(1.5);
    }

    .save-button {
      display: block;
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    .save-button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <header>
    <h1>Settings Panel</h1>
  </header>
  <main>
    <form role="form">
      <div class="setting">
        <label for="setting1">Enable Feature One</label>
        <input type="checkbox" id="setting1" name="setting1">
      </div>
      <div class="setting">
        <label for="setting2">Enable Feature Two</label>
        <input type="checkbox" id="setting2" name="setting2">
      </div>
      <div class="setting">
        <label for="setting3">Enable Feature Three</label>
        <input type="checkbox" id="setting3" name="setting3">
      </div>
      <div class="setting">
        <label for="setting4">Enable Feature Four</label>
        <input type="checkbox" id="setting4" name="setting4">
      </div>
      <button type="submit" class="save-button">Save</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2025 Settings Panel</p>
  </footer>
</body>
</html>
