<title>Scrutineer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* The Artifact runtime's head reset supplies this; a standalone document does not, and without
   it any class-level `display` silently overrides the [hidden] attribute. That is how an 82 %
   opaque overlay ended up painted over the whole stage. */
[hidden]{display:none !important}

/* Scrutineer broadcast frame — pixel type on a night palette. Tokens only; no colour outside these. */
:root{--night:#06081A;--studio:#121A4A;--tarmac:#2C2E3A;--ink:#000;--white:#FFF;--caption:#C8CBD8;--mid:#6A6F8A;--gold:#F4C542;--red:#E31E2D;--purple:#B04BFF;--cyan:#3DD2FF;--green:#2FD968;--amber:#FFA318}
html,body{background:var(--night);margin:0;color:var(--white);font-family:"VT323","Courier New",monospace;-webkit-font-smoothing:none}
.px{font-family:"Press Start 2P","Courier New",monospace;text-transform:uppercase}
.bcast{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;grid-template-rows:44px minmax(0,1fr) 196px 28px;grid-template-areas:"hdr hdr hdr" "tower stage panel" "tele lower panel" "ticker ticker ticker";width:100%;max-width:1440px;height:100vh;max-height:900px;margin:0 auto;background:var(--night);overflow:hidden}
.hdr{grid-area:hdr;display:flex;align-items:center;gap:20px;padding:0 12px;border-bottom:2px solid var(--studio);font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase}
.wordmark{font-size:16px;color:var(--white);border-bottom:3px solid var(--gold);padding-bottom:2px}
.hdr-mid{color:var(--caption);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--red);color:var(--white);padding:8px 14px;min-width:120px;text-align:center}
.badge.blue{background:var(--cyan);color:var(--ink)}.badge.green{background:var(--green);color:var(--ink)}.badge.gold{background:var(--gold);color:var(--ink)}.badge.black{background:var(--ink);color:var(--white);outline:2px solid var(--white)}.badge.purple{background:var(--purple);color:var(--white)}.badge.amber{background:var(--amber);color:var(--ink)}
.clock{color:var(--caption)}
.live{background:var(--red);padding:6px 10px}
/* timing tower */
.tower{grid-area:tower;background:var(--ink);overflow:hidden;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;display:flex;flex-direction:column}
.tower-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:9px 8px 7px;border-left:4px solid var(--red);color:var(--white);font-size:7px;white-space:nowrap}
.tower-sub{color:var(--mid)}
.tower-body{position:relative;flex:1;overflow:hidden}
.trow{position:absolute;left:0;right:0;height:20px;display:grid;grid-template-columns:24px 50px 70px 1fr 26px;align-items:center;gap:3px;padding:0 6px;color:var(--caption);font-size:7px;transition:none}
.trow .tm{font-family:"VT323","Courier New",monospace;font-size:16px;line-height:16px;color:var(--white);letter-spacing:0}
.trow .gap{color:var(--mid);white-space:nowrap;overflow:hidden;font-size:6px}
.trow .pts{text-align:right;color:var(--gold)}
.trow.cur{background:var(--studio);color:var(--gold)}.trow.cur .tm{color:var(--gold)}
.trow.dq .tm,.trow.strip .tm,.trow.void .tm{text-decoration:line-through;color:var(--mid)}
.trow.dq .gap{color:var(--red)}.trow.strip .gap{color:var(--amber)}.trow.void .gap{color:var(--purple)}
.trow.fast .gen{color:var(--purple)}
.tower-key{padding:8px 10px;color:var(--mid);display:flex;align-items:center;gap:4px;border-top:1px solid var(--studio)}
.tower-key i{display:inline-block;width:8px;height:8px;margin-right:2px}.tower-key .bf{background:linear-gradient(45deg,var(--ink) 50%,var(--white) 50%);outline:1px solid var(--white)}.tower-key .st{background:var(--amber)}.tower-key .fl{background:var(--purple)}
/* stage */
.stage-wrap{grid-area:stage;display:flex;flex-direction:column;background:var(--night);min-width:0;min-height:0}
.stage-box{position:relative;width:100%;aspect-ratio:16/9;max-height:100%;background:var(--night);overflow:hidden}
#stage{image-rendering:pixelated;image-rendering:crisp-edges;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase}
.hud .tl{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud .tr{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.hud .bl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud .br{position:absolute;right:12px;bottom:12px}
.hud .tag{background:var(--ink);color:var(--white);padding:6px 8px;display:inline-block}
.hud .tag.red{background:var(--red)}.hud .tag.gold{background:var(--gold);color:var(--ink)}.hud .tag.cyan{background:var(--cyan);color:var(--ink)}.hud .tag.green{background:var(--green);color:var(--ink)}.hud .tag.navy{background:var(--studio)}
.hud .big{font-family:"VT323","Courier New",monospace;font-size:32px;line-height:24px;background:var(--ink);padding:4px 8px;display:inline-block;color:var(--gold)}
.hud .speed{display:flex;align-items:flex-end;gap:8px;background:var(--ink);padding:6px 8px}
.hud .speed .n{font-family:"VT323","Courier New",monospace;font-size:32px;line-height:24px;color:var(--white)}
.hud .speed .bar{width:120px;height:8px;background:var(--studio);position:relative}.hud .speed .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
.hud .drs{background:var(--studio);color:var(--mid);padding:6px 8px}.hud .drs.on{background:var(--green);color:var(--ink)}
#hMap{image-rendering:pixelated;width:192px;height:128px;background:var(--ink);display:block}
/* cards over the stage */
.cards{position:absolute;inset:0;pointer-events:none}
.ui-cards{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:88px}
.card{background:var(--ink);border:4px solid var(--gold);padding:12px 18px;max-width:70%;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;color:var(--white)}
.card.black{border-color:var(--white)}.card.levelup{border-color:var(--cyan)}.card.debrief{border-color:var(--purple)}
.card-eyebrow{color:var(--gold);margin-bottom:8px}.card.levelup .card-eyebrow{color:var(--cyan)}.card.debrief .card-eyebrow{color:var(--purple)}
.card-title{font-size:12px;line-height:16px;margin-bottom:8px}
.card-body{font-family:"VT323","Courier New",monospace;font-size:20px;line-height:20px;text-transform:none;color:var(--caption)}
.card-foot{font-family:"VT323","Courier New",monospace;font-size:16px;line-height:16px;text-transform:none;color:var(--mid);margin-top:6px}
.pc-parts{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0}.pc-part b{color:var(--gold)}
.db-row{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;padding:3px 0;border-top:1px dashed var(--studio)}.db-row b{text-align:right;color:var(--green)}.db-row.fault b{color:var(--amber)}.db-row.penalty b{color:var(--red)}
.gen-chip{font-style:normal;background:var(--cyan);color:var(--ink);padding:2px 4px;font-size:6px;vertical-align:middle}
/* lineage strip */
.strip{flex:1;min-height:42px;background:var(--night);border-top:2px solid var(--studio);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:4px 10px;overflow:hidden;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase}
.strip-head{display:flex;justify-content:space-between;color:var(--caption)}.strip-key{color:var(--mid)}
.strip-row{display:flex;gap:6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px}.slot canvas{image-rendering:pixelated;width:36px;height:18px}.slot-n{color:var(--mid);font-size:6px}.slot.cur .slot-n{color:var(--cyan)}.slot.empty canvas{opacity:.5}
/* telemetry */
.telemetry{grid-area:tele;background:var(--night);border-top:2px solid var(--studio);overflow:hidden;font-size:16px;line-height:17px;color:var(--caption);padding:5px 8px;display:flex;flex-direction:column}
.tele-head{display:flex;align-items:baseline;gap:8px;border-left:4px solid var(--cyan);padding-left:6px;margin-bottom:4px;flex:none}.tele-head .px{font-size:7px;color:var(--white)}.tele-cap{font-family:"Press Start 2P","Courier New",monospace;font-size:5px;color:var(--cyan)}
.tele-lines{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tline{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;font-size:15px;line-height:15px}
.tline>*{flex:none}.tline.seal{color:var(--cyan)}.tline.warn{color:var(--amber)}
/* lower band */
.lower{grid-area:lower;display:grid;grid-template-columns:196px minmax(0,1fr) 232px;border-top:2px solid var(--studio);border-left:2px solid var(--studio);min-width:0;min-height:0}
.champ{padding:7px 9px;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;border-right:2px solid var(--studio);display:flex;flex-direction:column;gap:6px}
.champ-head{color:var(--caption)}.champ-pts{font-size:20px;color:var(--gold)}.champ-pts small{font-size:8px;color:var(--caption)}.champ-sub{color:var(--mid);font-size:6px;line-height:10px}
.champ-team{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--studio);padding-top:6px}.champ-team b{font-size:16px;color:var(--cyan)}.champ-era{color:var(--purple)}
.chart-box{position:relative;min-width:0;background:var(--night)}#chart{image-rendering:pixelated;width:100%;height:100%;display:block}
.controls{padding:7px 8px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;border-left:2px solid var(--studio);overflow:hidden}
.camdock{position:absolute;left:50%;bottom:54px;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.82);border:2px solid var(--studio);padding:4px 7px;pointer-events:auto;max-width:92%;flex-wrap:wrap;justify-content:center}
.camdock .cam-head{font-family:"Press Start 2P","Courier New",monospace;font-size:7px;color:var(--cyan);letter-spacing:.5px}
.camdock .cam-row{display:flex;gap:4px;flex-wrap:wrap}.controls .keys{width:100%;font-family:"Press Start 2P","Courier New",monospace;font-size:6px;color:var(--mid);text-transform:uppercase}
.seed-wrap{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;display:flex;align-items:center;gap:4px}.seed-wrap input{font-family:"VT323","Courier New",monospace;font-size:18px;width:64px;background:var(--ink);color:var(--cyan);border:2px solid var(--white);padding:2px 4px}
/* garage panel */
.garage-panel{grid-area:panel;background:var(--ink);border-left:2px solid var(--studio);overflow:auto;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.gp-head{display:flex;justify-content:space-between;color:var(--gold);padding:4px 0;border-bottom:2px solid var(--studio)}
.role{padding:5px 6px;border:1px solid var(--studio);cursor:pointer}.role.focus{border-color:var(--gold);background:var(--studio)}
.role-top{display:flex;justify-content:space-between}.role-name{color:var(--white)}.role-lvl{color:var(--cyan)}
.role-def{font-family:"VT323","Courier New",monospace;font-size:16px;line-height:14px;color:var(--caption);text-transform:none;margin:3px 0}
.xp{height:6px;background:var(--studio)}.xp i{display:block;height:100%;background:var(--green)}
.role-next{font-size:6px;color:var(--mid);margin-top:3px}
.gp-focus{font-size:6px;color:var(--mid);line-height:10px}
.finding{padding:5px 6px;border-left:3px solid var(--green);background:var(--night)}.finding.fault{border-color:var(--amber)}.finding.penalty{border-color:var(--red)}
.f-title{color:var(--white);line-height:12px}.f-title b{color:var(--green)}.finding.fault .f-title b{color:var(--amber)}.finding.penalty .f-title b{color:var(--red)}
.f-ev{font-family:"VT323","Courier New",monospace;font-size:16px;line-height:14px;color:var(--caption);text-transform:none;margin-top:3px}
.f-foot{font-family:"VT323","Courier New",monospace;font-size:14px;line-height:12px;color:var(--mid);text-transform:none;margin-top:2px}
/* ticker */
.ticker{grid-area:ticker;display:flex;align-items:center;background:var(--gold);color:var(--ink);font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-transform:uppercase;overflow:hidden}
.ticker-tag{background:var(--red);color:var(--white);padding:10px 12px;flex:none;z-index:1}
.ticker-track{white-space:nowrap;padding-left:12px;will-change:transform}
/* regs */
.regs{position:fixed;inset:5% 10%;background:var(--ink);border:4px solid var(--gold);color:var(--white);padding:20px 24px;overflow:auto;z-index:20;font-size:22px;line-height:26px}
.regs-head{display:flex;justify-content:space-between;align-items:center;font-family:"Press Start 2P","Courier New",monospace;font-size:10px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.regs-table{width:100%;border-collapse:collapse;margin-bottom:14px}.regs-table th{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;text-align:left;color:var(--caption);padding:6px 8px;border-bottom:2px solid var(--studio)}.regs-table td{padding:5px 8px;border-bottom:1px solid var(--studio);vertical-align:top}.regs-table td:last-child{color:var(--gold)}
.regs p{color:var(--caption);max-width:70ch}
button{font-family:"Press Start 2P","Courier New",monospace;font-size:7px;text-transform:uppercase;background:var(--studio);color:var(--white);border:2px solid var(--white);padding:6px 7px;cursor:pointer}
button.cam{padding:5px 7px;font-size:7px}
button[aria-pressed="true"],button.active{background:var(--gold);color:var(--ink);border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (max-width:1100px){.bcast{grid-template-columns:1fr;grid-template-rows:44px auto auto auto auto auto 28px;grid-template-areas:"hdr" "stage" "panel" "tower" "tele" "lower" "ticker";height:auto;max-height:none}.lower{border-left:0}.tower,.telemetry,.garage-panel{max-height:240px;overflow:auto}.tower-body{min-height:200px;overflow:auto}.lower{grid-template-columns:1fr;grid-auto-rows:auto}.chart-box{height:160px}.regs{inset:2% 3%}}
@media (prefers-reduced-motion:reduce){.ticker-track{transform:none!important}}
/* agent hues */
.hue-gold{--hue:var(--gold)}.hue-purple{--hue:var(--purple)}.hue-cyan{--hue:var(--cyan)}.hue-red{--hue:var(--red)}
.hue-amber{--hue:var(--amber)}.hue-green{--hue:var(--green)}.hue-white{--hue:var(--white)}
/* telemetry role tags */
.tl-role{display:inline-block;font-family:"Press Start 2P","Courier New",monospace;font-size:6px;line-height:6px;font-style:normal;color:var(--ink);background:var(--hue,var(--cyan));padding:3px 3px 2px;width:52px;text-align:center;overflow:hidden}
/* garage overlay: a card pinned over every station */
.gar-overlay{position:absolute;inset:0;pointer-events:none}
.gcard{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:grid;grid-template-columns:auto auto;grid-auto-rows:auto;gap:1px 6px;align-items:center;background:rgba(0,0,0,.86);border:2px solid var(--hue,var(--cyan));padding:3px 5px 4px;font-family:"Press Start 2P","Courier New",monospace;font-size:7px;color:var(--white);cursor:pointer;white-space:nowrap;line-height:9px}
.gcard:hover{background:var(--studio)}
.gcard.sel{border-color:var(--gold);background:var(--studio);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold)}
.gcard.up{border-color:var(--cyan);animation:none}
.gc-name{color:var(--hue,var(--cyan))}
.gc-part{color:var(--caption);font-size:6px;justify-self:end}
.gc-lvl{grid-column:1;color:var(--white);font-size:6px}
.gc-xp{grid-column:2;justify-self:end;display:block;width:38px;height:3px;background:var(--studio)}
.gc-xp b{display:block;height:100%;background:var(--green)}
.gar-legend{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);border:2px solid var(--gold);color:var(--gold);font-family:"Press Start 2P","Courier New",monospace;font-size:7px;padding:6px 10px}
/* garage panel: tokens and the selected agent */
.gp-tokens{display:flex;align-items:center;gap:8px;background:var(--studio);padding:6px 8px;flex-wrap:wrap}
.gp-tokens b{font-family:"VT323","Courier New",monospace;font-size:22px;line-height:16px;color:var(--gold)}
.gp-hint{font-size:6px;color:var(--mid);width:100%}
.gp-empty{font-size:7px;color:var(--mid);line-height:11px;padding:6px;border:1px dashed var(--studio)}
.gp-sel{border:2px solid var(--hue,var(--cyan));padding:6px 7px;display:flex;flex-direction:column;gap:4px}
.gs-top{display:flex;justify-content:space-between;color:var(--hue,var(--cyan))}
.gs-part{color:var(--caption)}
.gs-def{color:var(--white);line-height:11px}
.gs-blurb{font-family:"VT323","Courier New",monospace;font-size:17px;line-height:15px;text-transform:none;color:var(--caption)}
.gs-xp{font-size:6px;color:var(--mid)}.gs-next{font-size:6px;color:var(--cyan)}
.gs-btns{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.gs-btns button{font-size:7px;padding:6px 6px}
.gs-btns button[disabled]{opacity:.45;cursor:not-allowed}
.gs-agent{font-family:"VT323","Courier New",monospace;font-size:15px;line-height:14px;text-transform:none;color:var(--mid)}
.gs-agent b{font-family:"Press Start 2P","Courier New",monospace;font-size:6px;color:var(--caption);margin-right:4px;text-transform:uppercase}
.role.sel{border-color:var(--gold)}
.role .role-lvl{color:var(--hue,var(--cyan))}
.role .role-name{color:var(--hue,var(--white))}

/* ============================================================================
   The pit wall. The picture takes the middle and everything else is a readout
   on a rail: a glance has to be enough, so numbers get bars and states get
   lamps. Nothing below scrolls except the work band.
   ========================================================================= */
.app{display:grid;grid-template-rows:54px minmax(0,1fr) clamp(124px,19vh,196px);
  width:100%;height:100vh;height:100dvh;margin:0;background:var(--night);overflow:hidden}

/* ---- header: wordmark, the six sectors of a run, the button ---- */
.top{display:flex;align-items:center;gap:18px;padding:0 14px;
  border-bottom:2px solid var(--studio);
  background:linear-gradient(180deg,#0A0E28 0%,var(--night) 100%)}
.mark{position:relative;font-family:"Press Start 2P","Courier New",monospace;font-size:17px;
  letter-spacing:1.5px;color:var(--white);padding:0 1px 10px;flex:none;
  text-shadow:2px 2px 0 #000,-1px -1px 0 rgba(244,197,66,.5)}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:1px;height:6px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#0B1038 6px 12px),
    repeating-linear-gradient(90deg,#0B1038 0 6px,var(--gold) 6px 12px);
  background-size:100% 3px,100% 3px;background-position:0 0,0 3px;background-repeat:no-repeat}
/* the run, drawn as six sectors on a timing board */
.hdr-chips{display:flex;gap:3px;flex:1;min-width:0;overflow:hidden}
.sect{display:flex;flex-direction:column;gap:2px;padding:5px 9px;background:#0B1038;
  border-bottom:3px solid var(--studio);min-width:0}
.sect i{font-family:"Press Start 2P","Courier New",monospace;font-size:7px;
  font-style:normal;color:var(--mid)}
.sect b{font-family:"Press Start 2P","Courier New",monospace;font-size:9px;color:var(--mid);
  letter-spacing:.5px;white-space:nowrap}
.sect.done{border-bottom-color:var(--green)}.sect.done b{color:var(--caption)}
.sect.done i{color:var(--green)}
.sect.on{background:var(--studio);border-bottom-color:var(--gold)}
.sect.on b{color:var(--gold)}.sect.on i{color:var(--gold)}
.top-right{display:flex;align-items:center;gap:12px;flex:none}
.runcount{font-family:"Press Start 2P","Courier New",monospace;font-size:9px;color:var(--caption)}
.run{font-family:"Press Start 2P","Courier New",monospace;font-size:11px;padding:12px 20px;
  background:var(--gold);color:var(--ink);border:0;cursor:pointer;letter-spacing:.5px}
.run:hover:not(:disabled){background:#FFD75E}
.run:disabled{background:var(--studio);color:var(--mid);cursor:default}
.run.armed{animation:runpulse 1.6s ease-in-out infinite}
@keyframes runpulse{0%,100%{box-shadow:0 0 0 0 rgba(244,197,66,.55)}50%{box-shadow:0 0 0 8px rgba(244,197,66,0)}}
@media (prefers-reduced-motion:reduce){.run.armed{animation:none}}

/* ---- the deck: rail, picture, rail ---- */
.deck{display:grid;grid-template-columns:206px minmax(0,1fr) 248px;gap:10px;
  padding:10px 12px;min-height:0;min-width:0}
.rail{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;overflow:hidden}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font-family:"Press Start 2P","Courier New",monospace;font-size:9px;color:var(--gold);
  border-left:4px solid var(--gold);padding:4px 0 4px 6px;flex:none}
.rail-head em{font-style:normal;font-size:7px;color:var(--mid)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;flex:none}

/* ---- the picture: as large as the deck will allow, sized to 16:9 in script ---- */
.screen{display:flex;flex-direction:column;gap:7px;min-height:0;min-width:0}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage-box{position:relative;background:#000;border:2px solid var(--studio);overflow:hidden}
.stage-box canvas#stage{display:block;width:100%;height:100%;image-rendering:pixelated;
  image-rendering:crisp-edges}
.curtain{position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none;
  image-rendering:pixelated}
.curtain[hidden]{display:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,8,26,.82);pointer-events:none}
.say{margin:0;font-family:"VT323","Courier New",monospace;font-size:24px;line-height:25px;
  color:var(--white);min-height:52px;max-height:52px;overflow:hidden;flex:none;
  letter-spacing:.2px}
.say b{color:var(--gold)}
.say .num{color:var(--cyan)}
.say .good{color:var(--green)}
.say .bad{color:var(--red)}

/* ---- left rail: the ten components, read like tyre and brake temperatures ---- */
.rig-list{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:hidden auto;
  scrollbar-width:thin}
.part{display:block;width:100%;text-align:left;background:var(--studio);padding:6px 8px;
  border:0;border-left:4px solid var(--hue,var(--cyan));cursor:pointer;font:inherit;
  position:relative}
.part:hover{background:#1B245C}
.part.sel{outline:2px solid var(--gold)}
.part.up{animation:partup 1.2s ease-out}
@keyframes partup{0%{background:var(--gold)}100%{background:var(--studio)}}
@media (prefers-reduced-motion:reduce){.part.up{animation:none}}
.part-top{display:flex;justify-content:space-between;align-items:center;gap:6px;
  font-family:"Press Start 2P","Courier New",monospace;font-size:9px;color:var(--hue,var(--cyan))}
/* level as pips, not as a number to read */
.part-lvl{display:flex;gap:2px;flex:none}
.part-lvl i{width:5px;height:9px;background:var(--night);display:block}
.part-lvl i.on{background:var(--hue,var(--cyan))}
.part-does{display:block;margin-top:3px;font-family:"VT323","Courier New",monospace;
  font-size:17px;line-height:15px;color:var(--caption)}
/* the heat bar: how much of this run's lost time this component was blamed for */
.part-bar{height:4px;background:var(--night);margin-top:4px;overflow:hidden}
.part-bar b{display:block;height:100%;background:var(--hue,var(--cyan));width:0;
  transition:width .45s ease-out}
.part.hot{outline:2px solid var(--red)}
.part.hot .part-bar b{background:var(--red)}
.ghost-btn{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;
  background:transparent;color:var(--mid);border:1px solid var(--studio);padding:8px;
  cursor:pointer;width:100%}
.ghost-btn:hover{color:var(--white);border-color:var(--mid)}

/* ---- right rail: telemetry ---- */
.rail-r{gap:5px;overflow:hidden}
.gauge{background:var(--studio);padding:5px 8px 7px;display:flex;flex-direction:column;gap:3px;
  border-left:4px solid var(--mid);flex:none}
.g-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.g-head span{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;
  color:var(--caption);letter-spacing:.4px}
.g-head em{font-style:normal;font-family:"VT323","Courier New",monospace;font-size:14px;
  line-height:12px;color:var(--mid)}
.g-val{font-family:"VT323","Courier New",monospace;font-size:34px;line-height:28px;
  color:var(--white);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.g-val.good{color:var(--green)}.g-val.bad{color:var(--red)}
.g-sub{font-family:"VT323","Courier New",monospace;font-size:16px;line-height:15px;
  color:var(--mid)}
.g-sub.good{color:var(--green)}.g-sub.bad{color:var(--red)}
.gauge.g-hero{border-left-color:var(--gold);background:#101744}
.g-hero .g-val{font-size:46px;line-height:38px;color:var(--gold)}
/* delta strip: grows out of the centre, left when faster */
.dbar{position:relative;height:9px;background:var(--night);margin-top:2px}
.dbar u{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--mid);
  transform:translateX(-1px)}
.dbar i{position:absolute;top:0;bottom:0;width:0;background:var(--mid);
  transition:width .35s ease-out,left .35s ease-out}
.dbar i.good{background:var(--green)}.dbar i.bad{background:var(--red)}
/* one pip per interface the agent has to build */
.pips{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.pips i{width:9px;height:9px;background:var(--night);display:block}
.pips i.ok{background:var(--green)}.pips i.no{background:var(--red)}
.fbar{height:9px;background:var(--night);margin-top:3px}
.fbar i{display:block;height:100%;width:0;background:var(--cyan);transition:width .4s ease-out}
.fbar i.warn{background:var(--amber)}.fbar i.bad{background:var(--red)}
/* the ten checks, as a lamp panel */
.lamps{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:3px}
.lamp{background:var(--night);padding:5px 0 4px;text-align:center;
  font-family:"Press Start 2P","Courier New",monospace;font-size:7px;color:var(--mid);
  border-bottom:3px solid var(--tarmac)}
.lamp.pass{color:var(--ink);background:var(--green);border-bottom-color:#1AA34A}
.lamp.fail{color:var(--white);background:var(--red);border-bottom-color:#8E1119}
.verdict{display:flex;align-items:center;gap:8px;background:var(--ink);padding:9px 10px;
  border:2px solid var(--studio);margin-top:auto;flex:none}
.verdict i{width:14px;height:14px;background:var(--mid);flex:none;display:block}
.verdict b{font-family:"Press Start 2P","Courier New",monospace;font-size:11px;color:var(--mid);
  letter-spacing:.5px}
.verdict.live{border-color:var(--gold)}.verdict.live i{background:var(--gold);
  animation:blip 1s steps(2) infinite}.verdict.live b{color:var(--gold)}
.verdict.kept{border-color:var(--green)}.verdict.kept i{background:var(--green)}
.verdict.kept b{color:var(--green)}
.verdict.tossed{border-color:var(--red)}.verdict.tossed i{background:var(--red)}
.verdict.tossed b{color:var(--red)}
@keyframes blip{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.verdict.live i{animation:none}}

/* ---- the work band: the only thing on the page that scrolls ---- */
.work{border-top:2px solid var(--studio);padding:7px 14px 10px;min-height:0;overflow:auto;
  background:#04060F}
.work-head{font-family:"Press Start 2P","Courier New",monospace;font-size:9px;color:var(--gold);
  margin-bottom:6px;display:flex;gap:10px;align-items:baseline;position:sticky;top:-7px;
  background:#04060F;padding:3px 0}
.work-head em{font-style:normal;font-size:8px;color:var(--mid)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:3px}
.task{display:flex;gap:7px;align-items:baseline;font-family:"VT323","Courier New",monospace;
  font-size:18px;line-height:18px;color:var(--caption);background:var(--studio);padding:2px 7px;
  opacity:0;animation:taskin .25s ease-out forwards}
@keyframes taskin{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.task{animation:none;opacity:1}}
.task i{font-style:normal;width:10px}
.task.ok i{color:var(--green)}.task.no i{color:var(--red)}
.task.ok{border-left:3px solid var(--green)}.task.no{border-left:3px solid var(--red)}
.task span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{background:#04060F;border:1px solid var(--studio);padding:8px 10px;overflow:auto;
  max-height:150px;font-family:"Courier New",monospace;font-size:12px;line-height:16px;
  color:var(--caption);white-space:pre}
.code .add{color:var(--green)}.code .del{color:var(--red)}.code .at{color:var(--purple)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gates{display:flex;flex-direction:column;gap:2px}
.gate{display:flex;gap:8px;align-items:baseline;font-family:"VT323","Courier New",monospace;
  font-size:19px;line-height:19px;color:var(--mid);opacity:.35}
.gate.on{opacity:1;color:var(--caption)}
.gate i{font-style:normal;width:12px;color:var(--mid)}
.gate.pass i{color:var(--green)}.gate.fail i{color:var(--red)}.gate.fail{color:var(--red)}
.samples{display:flex;flex-direction:column;gap:8px}
.sample{background:var(--studio);padding:7px 9px}
.sample-top{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;margin-bottom:4px}
.sample-top .ok{color:var(--green)}.sample-top .no{color:var(--red)}
.sample p{margin:0 0 5px;font-family:"VT323","Courier New",monospace;font-size:17px;
  line-height:18px;color:var(--caption)}

/* station labels pinned over the room, so the rail points at something */
.cards{position:absolute;inset:0;pointer-events:none;z-index:4}
.hud{position:absolute;inset:0;pointer-events:none;z-index:3}
.stag{position:absolute;transform:translate(-50%,-100%);display:flex;gap:6px;align-items:baseline;
  background:rgba(0,0,0,.86);border:1px solid var(--hue,var(--cyan));padding:3px 6px;
  font-family:"Press Start 2P","Courier New",monospace;font-size:8px;white-space:nowrap;
  transition:opacity .2s ease}
.stag b{color:var(--hue,var(--cyan))}
.stag i{font-style:normal;color:var(--caption);font-size:7px}
.stag[hidden]{display:none}
.stag.dim{opacity:.25}
.stag.hot{border-width:2px;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold);
  background:var(--studio);font-size:9px;padding:4px 7px}
.stag.hot b{color:var(--white)}

/* run-it-yourself */
.trial-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:12px 0 6px}
.trial-form label{display:flex;flex-direction:column;gap:4px;
  font-family:"Press Start 2P","Courier New",monospace;font-size:8px;color:var(--caption)}
.trial-form input,.trial-form select{background:var(--night);color:var(--white);
  border:1px solid var(--studio);padding:8px;font-family:"VT323","Courier New",monospace;font-size:18px}
.trial-form input{min-width:290px}
.trial-col{background:var(--studio);padding:9px 10px}
.trial-head{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;color:var(--gold);
  margin-bottom:5px}
.trial-meta{font-family:"VT323","Courier New",monospace;font-size:17px;color:var(--caption);
  margin-bottom:6px}
.trial-slot{font-family:"VT323","Courier New",monospace;font-size:18px;color:var(--mid)}
.trial-run{margin-top:6px;font-family:"Press Start 2P","Courier New",monospace;font-size:8px;
  color:var(--mid)}
.trial-run.pass{color:var(--green)}.trial-run.fail{color:var(--red)}

/* the interfaces the agent built: the artifact a reviewer can open */
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:4px}
.page{display:block;text-decoration:none;background:var(--studio);padding:6px 8px;
  border-left:3px solid var(--red)}
.page.ok{border-left-color:var(--green)}
.page:hover{background:#1B245C}
.page-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-family:"Press Start 2P","Courier New",monospace;font-size:8px;color:var(--white)}
.page-top i{font-style:normal;font-size:7px}
.page-top i.ok{color:var(--green)}.page-top i.no{color:var(--red)}
.page-sub{display:block;margin-top:3px;font-family:"VT323","Courier New",monospace;font-size:16px;
  line-height:17px;color:var(--caption);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-note{margin:8px 0 0;font-family:"VT323","Courier New",monospace;font-size:17px;
  line-height:19px;color:var(--mid)}
.page-note b{color:var(--caption)}
.preview{width:100%;height:230px;border:1px solid var(--studio);background:#fff}

/* the rule-by-run heatmap */
.heat{display:flex;flex-direction:column;gap:2px;font-family:"VT323","Courier New",monospace;
  font-size:16px}
.heat-row{display:flex;gap:2px;align-items:stretch}
.heat-head{font-family:"Press Start 2P","Courier New",monospace;font-size:7px;color:var(--mid)}
.heat-rule{flex:0 0 138px;color:var(--caption);padding:2px 4px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.heat-rule.gone{color:var(--green)}.heat-rule.down{color:var(--cyan)}.heat-rule.up{color:var(--red)}
.heat-cell{flex:1 1 0;min-width:18px;text-align:center;padding:2px 0;color:var(--white);
  background:rgba(227,30,45,calc(var(--v,0)*0.85));font-variant-numeric:tabular-nums}
.heat-cell.future{background:transparent;color:var(--studio)}
.heat-cell.total{background:var(--studio);color:var(--caption)}
.heat-cell.kept{box-shadow:inset 0 -3px 0 var(--gold)}

/* Narrow and short screens: the rails fold under the picture rather than shrink it. */
@media (max-width:1080px){
  .app{grid-template-rows:52px minmax(0,1fr) auto;height:auto;min-height:100vh;overflow:auto}
  .deck{grid-template-columns:1fr;grid-auto-rows:auto}
  .rail{max-height:none;overflow:visible}
  .rig-list{overflow:visible}
  .hdr-chips{display:none}
  .two{grid-template-columns:1fr}
}
@media (max-height:640px){
  .app{grid-template-rows:48px minmax(0,1fr) 110px}
  .say{font-size:20px;line-height:21px;min-height:42px;max-height:42px}
  .g-val{font-size:28px;line-height:24px}.g-hero .g-val{font-size:36px;line-height:30px}
  .gauge{padding:4px 7px 5px}
}

/* the state of tune, pinned over the picture */
.tier{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.86);
  border-left:4px solid var(--gold);padding:5px 9px 6px;pointer-events:none}
.tier-top{display:flex;align-items:center;gap:9px}
.tier-top b{font-family:"Press Start 2P","Courier New",monospace;font-size:10px;color:var(--gold);
  letter-spacing:.5px}
.tier-pips{display:flex;gap:3px}
.tier-pips i{width:7px;height:11px;background:var(--studio);display:block}
.tier-pips i.on{background:var(--gold)}
.tier-of{font-family:"VT323","Courier New",monospace;font-size:17px;line-height:16px;
  color:var(--caption);margin-top:3px}
.tier.bump{animation:tierbump .9s ease-out}
@keyframes tierbump{0%{background:var(--gold)}12%{background:var(--gold)}100%{background:rgba(0,0,0,.86)}}
@keyframes tierbumpb{0%,12%{color:var(--ink)}100%{color:var(--gold)}}
.tier.bump .tier-top b{animation:tierbumpb .9s ease-out}
@media (prefers-reduced-motion:reduce){.tier.bump,.tier.bump .tier-top b{animation:none}}

/* ---- the view switch, and the developer view it reveals ---- */
.vswitch{display:flex;gap:2px;flex:none}
.vtab{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;padding:9px 11px;
  background:#0B1038;color:var(--mid);border:0;border-bottom:3px solid var(--studio);cursor:pointer}
.vtab:hover{color:var(--caption)}
.vtab.active{background:var(--studio);color:var(--cyan);border-bottom-color:var(--cyan)}
/* the developer view takes the whole body of the page, so the app becomes one row */
.app.devmode{grid-template-rows:54px minmax(0,1fr)}
.app.devmode .deck,.app.devmode .work{display:none}
.dev{min-height:0;overflow:hidden;background:#04060F;padding:10px 12px}
.dgrid{display:grid;height:100%;min-height:0;gap:8px;
  grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,0.85fr);
  grid-template-rows:minmax(0,1fr) minmax(0,0.92fr) minmax(0,1.02fr)}
.dcard{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--night);
  border:1px solid var(--studio);border-left:3px solid var(--cyan)}
.dcard canvas{flex:1;min-height:0;width:100%;display:block}
.dcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:none;
  padding:5px 8px 4px;border-bottom:1px solid var(--studio)}
.dcard-h span{font-family:"Press Start 2P","Courier New",monospace;font-size:8px;
  color:var(--white);letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard-h em{font-style:normal;font-family:"VT323","Courier New",monospace;font-size:14px;
  line-height:12px;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Placed explicitly rather than auto-flowed: a spanning card and an auto-placed one fight
   each other for the same cell, and the loser gets whatever height is left over. */
.dgrid>*:nth-child(1){grid-area:1/1/2/3}   /* one lap, across the top   */
.dgrid>*:nth-child(2){grid-area:2/1/3/2}   /* inference meter            */
.dgrid>*:nth-child(3){grid-area:1/3/3/4}   /* credit graph, full height  */
.dgrid>*:nth-child(4){grid-area:2/2/3/3}   /* rails                      */
.dgrid>*:nth-child(5){grid-area:3/1/4/2}   /* failure modes              */
.dgrid>*:nth-child(6){grid-area:3/2/4/4}   /* claimed vs held-out        */
#dev .dcard:nth-child(2){border-left-color:var(--red)}
#dev .dcard:nth-child(3){border-left-color:var(--purple)}
#dev .dcard:nth-child(4){border-left-color:var(--green)}
#dev .dcard:nth-child(5){border-left-color:var(--amber)}
#dev .dcard:nth-child(6){border-left-color:var(--gold)}
@media (max-width:1080px){
  .app.devmode{grid-template-rows:52px auto;height:auto;min-height:100vh;overflow:auto}
  .dev{overflow:visible}
  .dgrid{grid-template-columns:1fr;grid-auto-rows:minmax(190px,auto);height:auto}
  .dgrid>*:nth-child(n){grid-area:auto}
}

</style>
</head>
<body>
<!-- Scrutineer. A pit wall: the picture in the middle, the readouts on the rails. -->
<div class="app" id="app">
  <header class="top">
    <div class="mark">SCRUTINEER</div>
    <div class="hdr-chips" id="hdrChips"></div>
    <div class="top-right">
      <div class="vswitch" id="vswitch" role="tablist">
        <button class="vtab active" data-view="broadcast" role="tab" aria-selected="true">BROADCAST</button>
        <button class="vtab" data-view="dev" role="tab" aria-selected="false">DEVELOPER</button>
      </div>
      <span class="runcount" id="runCount"></span>
      <button class="run" id="runBtn">RUN THE AGENT</button>
    </div>
  </header>

  <main class="deck">
    <aside class="rail rail-l" aria-label="The harness">
      <div class="rail-head"><span>THE HARNESS</span><em class="rig-sub" id="rigSub"></em></div>
      <div class="rig-list" id="rig"></div>
      <div class="rail-foot">
        <button class="ghost-btn" id="regsBtn">how this works</button>
        <button class="ghost-btn" id="tryBtn">run it yourself</button>
      </div>
    </aside>

    <section class="screen">
      <div class="stage-wrap" id="stageWrap">
        <div class="stage-box" id="stageBox">
          <canvas id="stage" aria-label="The agent's harness"></canvas>
          <div class="hud" id="hud"></div>
          <div class="cards" id="cards"></div>
          <canvas class="curtain" id="curtain" aria-hidden="true"></canvas>
          <div class="overlay" id="overlay" hidden></div>
        </div>
      </div>
      <p class="say" id="say">Six components decide how this agent works. Press <b>RUN THE AGENT</b>.</p>
    </section>

    <aside class="rail rail-r" id="tele" aria-label="Telemetry"></aside>
  </main>

  <section class="work" id="work" aria-label="The agent's work"></section>
  <section class="dev" id="dev" hidden aria-label="Developer view"></section>
  <div class="regs" id="regs" hidden></div>
</div>

gree and the\n+accessible name no longer contains the visible text. Do not write `role=\"form\"`, `role=\"button\"`\n+or `role=\"list\"` onto the element that already implies it. If a class like `visually-hidden` is\n+referenced, it must exist in the stylesheet.\n",

kground-color` under it. Every `<img>` has\n+an `alt`, decorative ones `alt=\"\"`; icon-only buttons carry `aria-label`. The document declares\n+`<html lang=\"en\">`.\n+\n+## ref-tabular\n+concepts: tables, lists\n+Data tables carry a `<caption>` and `<th scope=\"col\">` / `<th scope=\"row\">`; a sortable header\n+puts `aria-sort=\"ascending|descending|none\"` on the `<th>` and updates it on click. Grouped\n+items are `<ul>`, `<ol>` or `<dl>` with only `<li>` children, not stacked `<div>`s.\n",

const fx = (n, d = 2) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(d);

// The six phases of a run, drawn as sectors on a timing board.
const SECTORS = [
  { key: 'RUN',      label: 'BUILD' },
  { key: 'SCORE',    label: 'AUDIT' },
  { key: 'DIAGNOSE', label: 'BLAME' },
  { key: 'CHANGE',   label: 'PATCH' },
  { key: 'GATES',    label: 'CHECK' },
  { key: 'RESULT',   label: 'VERDICT' },
];

const GATE_ORDER = ['diff_size', 'comparable_ab', 'novelty', 'evidence', 'seesaw',
  'correlation', 'regression', 'cost_cap', 'scrutineering', 'rl_entropy'];
// Four letters is all a lamp needs; the sentence is in the work band below.
const GATE_TAG = { diff_size: 'SIZE', comparable_ab: 'A/B', novelty: 'NEW', evidence: 'EVID',
  seesaw: 'BOTH', correlation: 'CORR', regression: 'REGR', cost_cap: 'COST',
  scrutineering: 'FIA', rl_entropy: 'ENTR' };

const nodes = {};
let built = false;

// ---------------------------------------------------------------------------------------
// furniture
// ---------------------------------------------------------------------------------------
D.build = function () {
  if (built) return;
  built = true;

  // ---- header: the six sectors of a run ----
  const chips = $('hdrChips');
  if (chips) {
    chips.textContent = '';
    nodes.sect = {};
    SECTORS.forEach((s, i) => {
      const n = el('div', 'sect');
      n.innerHTML = `<i>S${i + 1}</i><b>${s.label}</b>`;
      chips.append(n);
      nodes.sect[s.key] = n;
    });
  }

  // ---- right rail: the telemetry stack ----
  const tele = $('tele');
  if (!tele) return;
  tele.textContent = '';

  // score: the one number the whole loop is trying to move
  const score = gauge(tele, 'SCORE', 'lower is faster');
  score.classList.add('g-hero');
  nodes.score = el('b', 'g-val', '—');
  nodes.scoreSub = el('div', 'g-sub');
  score.append(nodes.score, nodes.scoreSub);

  // delta against the previous run, drawn the way a live timing delta is
  const delta = gauge(tele, 'DELTA', 'against the last run');
  nodes.delta = el('b', 'g-val g-delta', '—');
  const dbar = el('div', 'dbar');
  nodes.deltaFill = el('i');
  dbar.append(el('u'), nodes.deltaFill);          // u = the centre tick
  delta.append(nodes.delta, dbar);

  // interfaces: one pip per brief, lit as each page comes back from the audit
  const clean = gauge(tele, 'INTERFACES', 'clean / built');
  nodes.cleanVal = el('b', 'g-val', '—');
  nodes.pips = el('div', 'pips');
  clean.append(nodes.cleanVal, nodes.pips);

  // budget: the cost cap, spent against allowed
  const fuel = gauge(tele, 'BUDGET', 'spent this run');
  nodes.fuelVal = el('b', 'g-val', '—');
  const fbar = el('div', 'fbar');
  nodes.fuelFill = el('i');
  fbar.append(nodes.fuelFill);
  fuel.append(nodes.fuelVal, fbar);

  // the ten gates, as a lamp panel
  const gates = gauge(tele, 'THE TEN CHECKS', 'a change passes all or none');
  nodes.lamps = el('div', 'lamps');
  nodes.lampBy = {};
  for (const g of GATE_ORDER) {
    const n = el('div', 'lamp');
    n.innerHTML = `<span>${GATE_TAG[g] || g}</span>`;
    n.dataset.gate = g;
    nodes.lamps.append(n);
    nodes.lampBy[g] = n;
  }
  gates.append(nodes.lamps);

  // the verdict light: the single thing a spectator is waiting for
  const v = el('div', 'verdict');
  v.innerHTML = '<i></i><b>STANDBY</b>';
  nodes.verdict = v;
  tele.append(v);
};

// The picture is sized in script rather than in CSS: it has to be the largest 16:9 that fits
// the deck in BOTH axes, and the station labels are positioned as a percentage of the box, so
// the box itself has to be exactly the picture — no letterboxing inside it.
D.fitStage = function () {
  const wrap = $('stageWrap'), box = $('stageBox');
  if (!wrap || !box) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;
  const s = Math.min(w / 16, h / 9);
  box.style.width = Math.floor(s * 16) + 'px';
  box.style.height = Math.floor(s * 9) + 'px';
};

D.watchStage = function () {
  D.fitStage();
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => D.fitStage());
    const wrap = $('stageWrap'); if (wrap) ro.observe(wrap);
  }
  window.addEventListener('resize', () => D.fitStage());
};

function gauge(host, label, sub) {
  const n = el('div', 'gauge');
  const h = el('div', 'g-head');
  h.innerHTML = `<span>${label}</span>` + (sub ? `<em>${sub}</em>` : '');
  n.append(h);
  host.append(n);
  return n;
}

// ---------------------------------------------------------------------------------------
// readouts
// ---------------------------------------------------------------------------------------
D.phase = function (name) {
  if (!nodes.sect) return;
  const order = SECTORS.map(s => s.key);
  const at = order.indexOf(name);
  order.forEach((k, i) => {
    const n = nodes.sect[k]; if (!n) return;
    n.classList.toggle('on', i === at);
    n.classList.toggle('done', at >= 0 && i < at);
  });
};

D.score = function (v) {
  if (!nodes.score) return;
  nodes.score.textContent = fx(v);
};

D.scoreSub = function (text, tone) {
  if (!nodes.scoreSub) return;
  nodes.scoreSub.textContent = text || '';
  nodes.scoreSub.className = 'g-sub' + (tone ? ' ' + tone : '');
};

// Positive = faster than the last run. The bar grows from the centre, like a delta strip.
D.delta = function (d) {
  if (!nodes.delta) return;
  if (d === null || d === undefined || isNaN(d)) {
    nodes.delta.textContent = '—';
    nodes.delta.className = 'g-val g-delta';
    nodes.deltaFill.style.width = '0%';
    return;
  }
  const better = d > 0.005, worse = d < -0.005;
  nodes.delta.textContent = (d > 0 ? '-' : d < 0 ? '+' : '') + fx(Math.abs(d));
  nodes.delta.className = 'g-val g-delta' + (better ? ' good' : worse ? ' bad' : '');
  const mag = Math.min(1, Math.abs(d) / 12);
  nodes.deltaFill.className = better ? 'good' : worse ? 'bad' : '';
  nodes.deltaFill.style.width = (mag * 50).toFixed(1) + '%';
  nodes.deltaFill.style.left = better ? (50 - mag * 50).toFixed(1) + '%' : '50%';
};

// One pip per brief. Grey = not built yet, green = zero violations, red = violations.
D.pipsFor = function (total) {
  if (!nodes.pips) return;
  nodes.pips.textContent = '';
  for (let i = 0; i < total; i++) nodes.pips.append(el('i'));
  nodes.cleanVal.textContent = `0 / ${total}`;
};

D.pip = function (i, ok) {
  if (!nodes.pips) return;
  const n = nodes.pips.children[i];
  if (n) n.className = ok ? 'ok' : 'no';
};

D.clean = function (clean, done, total) {
  if (!nodes.cleanVal) return;
  nodes.cleanVal.textContent = `${clean} / ${done || total}`;
  nodes.cleanVal.className = 'g-val' + (clean ? ' good' : '');
};

D.budget = function (usd, cap) {
  if (!nodes.fuelVal) return;
  if (usd === null || usd === undefined) { nodes.fuelVal.textContent = '—';
    nodes.fuelFill.style.width = '0%'; return; }
  const c = cap || 3;
  nodes.fuelVal.textContent = '$' + fx(usd);
  const k = Math.min(1, usd / c);
  nodes.fuelFill.style.width = (k * 100).toFixed(1) + '%';
  nodes.fuelFill.className = k > 0.95 ? 'bad' : k > 0.7 ? 'warn' : '';
};

// `shown` gates have fired; the rest stay dark. A failure stops the sequence, so any
// lamp after the first red stays dark on purpose.
D.gates = function (list, shown) {
  if (!nodes.lampBy) return;
  for (const g of GATE_ORDER) {
    const n = nodes.lampBy[g];
    if (n) n.className = 'lamp';
  }
  const n = shown === undefined ? (list || []).length : shown;
  (list || []).slice(0, n).forEach(g => {
    const lamp = nodes.lampBy[g.gate];
    if (lamp) lamp.className = 'lamp ' + (g.ok ? 'pass' : 'fail');
  });
};

D.gatesClear = function () { D.gates([], 0); };

// STANDBY · RUNNING · KEPT · THROWN AWAY — the one word a spectator needs.
D.verdict = function (word, tone) {
  if (!nodes.verdict) return;
  nodes.verdict.querySelector('b').textContent = word;
  nodes.verdict.className = 'verdict' + (tone ? ' ' + tone : '');
};

// The state of tune, pinned over the picture. Five pips and a name: the point is that you
// can see the car and the circuit change and then read what changed, not the other way round.
D.tier = function (index, name, of, count) {
  const hud = $('hud'); if (!hud) return;
  let box = $('tierBadge');
  if (!box) {
    box = el('div', 'tier'); box.id = 'tierBadge';
    box.innerHTML = '<div class="tier-top"><b data-name></b><span class="tier-pips" data-pips></span></div>'
      + '<div class="tier-of" data-of></div>';
    hud.append(box);
  }
  box.querySelector('[data-name]').textContent = name;
  box.querySelector('[data-of]').textContent = of || '';
  const pips = box.querySelector('[data-pips]');
  if (pips.children.length !== count) { pips.textContent = '';
    for (let i = 0; i < count; i++) pips.append(el('i')); }
  [...pips.children].forEach((p, i) => { p.className = i <= index ? 'on' : ''; });
  box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
};

D.reset = function () {
  D.gatesClear();
  D.verdict('STANDBY');
  D.delta(null);
};
})(window.SCR = window.SCR || {});

// ===== devgraphs.js =====
// ============================================================================
// SCR.devgraphs — three canvas readouts for the developer dashboard.
//
// These are pure: given (ctx, w, h, t, data) they draw and nothing else. No
// frame state, no timers — `t` is the only clock, so a caller can scrub, pause
// or re-render at any rate and get the same picture. That is what lets the
// dashboard tear down and rebuild panels without motion popping.
// ============================================================================
(function (SCR) {
'use strict';
const G = SCR.devgraphs = {};

// project tokens. nothing here invents a colour.
const NIGHT = '#06081A', STUDIO = '#121A4A', TARMAC = '#2C2E3A';
const WHITE = '#FFFFFF', CAPTION = '#C8CBD8', MID = '#6A6F8A';
const GOLD = '#F4C542', RED = '#E31E2D', PURPLE = '#B04BFF';
const CYAN = '#3DD2FF', GREEN = '#2FD968', AMBER = '#FFA318';

const PX = "px 'Press Start 2P', monospace";   // labels: shouting, so keep them short
const VT = "px 'VT323', monospace";            // numbers: the actual content

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// alpha is applied via globalAlpha rather than rgba strings — no per-frame string building.

// mast modes are the taxonomy the diagnoser blames; colour is the only legend we get.
function modeColor (m) {
  if (m === '1.4-loss-of-history') return CYAN;
  if (m === '1.5-unaware-of-stopping') return AMBER;
  if (m === '1.2-tool-schema-error') return RED;
  return PURPLE;
}

// a panel with nothing in it should still look deliberate, not broken.
function empty (ctx, w, h) {
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = MID;
  ctx.font = 7 + PX;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('NO DATA', w / 2, h / 2);
  ctx.restore();
}

// ---------------------------------------------------------------------------------------
// 1. credit graph — who got blamed for what, and how sure we were
// ---------------------------------------------------------------------------------------
G.creditGraph = function (ctx, w, h, t, data) {
  if (!(w > 0) || !(h > 0)) return;
  const rows = data && data.rows;
  let items = data && data.items;
  let roles = data && data.roles;
  if (!rows || !rows.length) { empty(ctx, w, h); return; }

  // tolerate a caller that hands us rows only.
  if (!items || !items.length) { items = []; for (let i = 0; i < rows.length; i++) { const v = rows[i] && rows[i].item; if (v && items.indexOf(v) < 0) items.push(v); } }
  if (!roles || !roles.length) { roles = []; for (let i = 0; i < rows.length; i++) { const v = rows[i] && rows[i].blamed_role; if (v && roles.indexOf(v) < 0) roles.push(v); } }
  if (!items.length || !roles.length) { empty(ctx, w, h); return; }

  ctx.save();

  const tiny = w < 380 || h < 190;
  const fs = tiny ? 6 : 7;
  const padX = tiny ? 20 : 30;
  const padY = tiny ? 12 : 16;
  const xL = padX, xR = w - padX;
  const span = xR - xL;
  if (span < 24) { ctx.restore(); empty(ctx, w, h); return; }

  const yOf = (i, n) => n < 2 ? h / 2 : padY + (h - padY * 2) * (i / (n - 1));

  // role weight: AERO swallows nearly every row, and the picture should say so.
  let maxCount = 1;
  const counts = new Array(roles.length).fill(0);
  for (let i = 0; i < rows.length; i++) {
    const k = roles.indexOf(rows[i] && rows[i].blamed_role);
    if (k >= 0) { counts[k]++; if (counts[k] > maxCount) maxCount = counts[k]; }
  }

  // ---- edges ----
  ctx.lineCap = 'round';
  const cap = Math.min(rows.length, 240);       // hard ceiling keeps the 2ms budget honest
  for (let i = 0; i < cap; i++) {
    const r = rows[i]; if (!r) continue;
    const ii = items.indexOf(r.item), ri = roles.indexOf(r.blamed_role);
    if (ii < 0 || ri < 0) continue;
    const conf = clamp(typeof r.confidence === 'number' ? r.confidence : 0.5, 0, 1);
    const y0 = yOf(ii, items.length), y1 = yOf(ri, roles.length);
    const c0 = xL + span * 0.42, c1 = xR - span * 0.42;
    const col = modeColor(r.mast_mode);

    ctx.globalAlpha = 0.14 + conf * 0.42;
    ctx.strokeStyle = col;
    ctx.lineWidth = 0.6 + conf * 1.7;
    ctx.beginPath();
    ctx.moveTo(xL, y0);
    ctx.bezierCurveTo(c0, y0, c1, y1, xR, y1);
    ctx.stroke();

    // packet. the phase offset is per-edge so the bundle shimmers instead of marching.
    const s = ((t * 0.28 + i * 0.0773 + ii * 0.17) % 1);
    const u = 1 - s, a = u * u * u, b = 3 * u * u * s, c = 3 * u * s * s, d = s * s * s;

    ctx.globalAlpha = 0.35 + 0.55 * Math.sin(s * Math.PI);   // fade in and out at the ends
    ctx.fillStyle = col;

    ctx.beginPath();
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }

  // ---- nodes ----
  ctx.font = fs + PX;
  ctx.textBaseline = 'middle';

  ctx.textAlign = 'right';
  for (let i = 0; i < items.length; i++) {
    const y = yOf(i, items.length);
    ctx.globalAlpha = 1;
    ctx.fillStyle = STUDIO;
    ctx.beginPath(); ctx.arc(xL, y, 3.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = CAPTION; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(xL, y, 3.2, 0, TAU); ctx.stroke();
    if (items.length <= 14) { ctx.globalAlpha = 0.7; ctx.fillStyle = CAPTION; ctx.fillText(String(items[i]), xL - 6, y); }
  }

  ctx.textAlign = 'left';
  for (let i = 0; i < roles.length; i++) {
    const y = yOf(i, roles.length);
    const share = counts[i] / maxCount;
    const rr = 3 + share * (tiny ? 4 : 7) + Math.sin(t * 1.3 + i) * 0.35 * share;
    ctx.globalAlpha = 0.18 + share * 0.3;
    ctx.fillStyle = GOLD;
    ctx.beginPath(); ctx.arc(xR, y, rr + 3.5, 0, TAU); ctx.fill();      // halo carries the weight
    ctx.globalAlpha = 0.45 + share * 0.55;
    ctx.beginPath(); ctx.arc(xR, y, rr, 0, TAU); ctx.fill();
    if (roles.length <= 14) {
      ctx.globalAlpha = 0.5 + share * 0.5;
      ctx.fillStyle = share > 0.5 ? WHITE : CAPTION;
      ctx.fillText(String(roles[i]), xR + rr + 5, y);
    }
  }

  ctx.restore();
};

// ---------------------------------------------------------------------------------------
// 2. failure modes — which WCAG tags the agent keeps missing
// ---------------------------------------------------------------------------------------
G.failureModes = function (ctx, w, h, t, data) {
  if (!(w > 0) || !(h > 0)) return;
  const tally = data && data.tally;
  if (!tally) { empty(ctx, w, h); return; }

  const keys = Object.keys(tally);
  if (!keys.length) { empty(ctx, w, h); return; }
  keys.sort((a, b) => (tally[b] - tally[a]) || (a < b ? -1 : 1));
  const n = Math.min(keys.length, 8);

  let max = 0;
  for (let i = 0; i < n; i++) { const v = +tally[keys[i]] || 0; if (v > max) max = v; }
  if (!(max > 0)) { empty(ctx, w, h); return; }

  ctx.save();

  const tiny = w < 400;
  const labelW = clamp(w * 0.28, 44, 96);
  const numW = tiny ? 30 : 40;
  const x0 = labelW + 6;
  const track = w - x0 - numW - 4;
  if (track < 12) { ctx.restore(); empty(ctx, w, h); return; }

  const rowH = h / n;
  const barH = clamp(rowH * 0.5, 3, 16);
  const fs = rowH < 18 ? 6 : 7;
  ctx.textBaseline = 'middle';

  for (let i = 0; i < n; i++) {
    const v = +tally[keys[i]] || 0;
    const y = rowH * (i + 0.5);
    const col = i < 2 ? RED : i < 4 ? AMBER : CYAN;
    const bw = Math.max(1, track * (v / max));

    // rail first, so short bars still read as a position on a scale
    ctx.globalAlpha = 1;
    ctx.fillStyle = TARMAC;
    ctx.fillRect(x0, y - barH / 2, track, barH);

    ctx.globalAlpha = 0.9;
    ctx.fillStyle = col;
    ctx.fillRect(x0, y - barH / 2, bw, barH);

    // t never resets, so there is no grow-in to play — the leading edge breathes instead.
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 - i * 0.55);
    ctx.globalAlpha = 0.25 + pulse * 0.65;
    ctx.fillStyle = WHITE;
    ctx.fillRect(x0 + bw - 2, y - barH / 2, 2, barH);

    ctx.globalAlpha = 0.82;
    ctx.fillStyle = CAPTION;
    ctx.font = fs + PX;
    ctx.textAlign = 'left';
    ctx.fillText(String(keys[i]).slice(0, 10).toUpperCase(), 2, y);

    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.font = (rowH < 18 ? 14 : 18) + VT;
    ctx.textAlign = 'right';
    ctx.fillText(String(v), w - 2, y);
  }

  ctx.restore();
};

// ---------------------------------------------------------------------------------------

G.runHistory = function (ctx, w, h, t, data) {

  if (!runs || runs.length < 1) { empty(ctx, w, h); return; }

  ctx.save();

  const tiny = w < 400 || h < 190;

  for (let i = n - 1; i >= 0; i--) { const v = runs[i] ? +runs[i].official : NaN; ctx.lineTo(xOf(i), yOf(isFinite(v) ? v : lo)); }
  ctx.closePath();

    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = col;

    ctx.beginPath();
    let started = false;
    for (let i = 0; i < n; i++) {
      const v = runs[i] ? +runs[i][key] : NaN; if (!isFinite(v)) continue;
      const x = xOf(i), y = yOf(v);
      if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
    }
    if (started) ctx.stroke();
    ctx.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const v = runs[i] ? +runs[i][key] : NaN; if (!isFinite(v)) continue;

      ctx.fillRect(xOf(i) - bw / 2, base - bh, bw, bh);

    ctx.lineWidth = 1;

        clearTimeout(timer);
        done({ violations, missing,
               weighted: violations.reduce((a, v) => a + (WEIGHT[v.impact] || 1) * v.n, 0) });
      } catch (e) {
        clearTimeout(timer);
        done({ error: String(e).slice(0, 160) });
      }
    };
    frame.srcdoc = html;
  });
}

async function ask({ key, provider, model, system, user }) {
  const r = await fetch('/api/infer', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ key, provider, model, system, user, temperature: 0.2, max_tokens: 2000 }),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `relay returned ${r.status}`);
  return d;
}

function extractHtml(text) {
  const m = String(text || '').match(/```(?:html)?\s*\n([\s\S]*?)```/);
  let body = (m ? m[1] : String(text || '')).trim();
  const i = body.indexOf('<');
  return i > 0 ? body.slice(i) : body;
}

async function go() {

  if (!key) { $('tNote').textContent = 'Paste a key first.'; return; }
  const provider = key.startsWith('sk-ant-') ? 'anthropic' : 'wandb';
  const model = provider === 'anthropic' ? 'claude-haiku-4-5-20251001' : state.data.models[0];
  const t = state.data.tasks[state.task];

        + `<div class="trial-run">auditing…</div>`;

      const line = slot.querySelector('.trial-run');
      if (a.error) { line.className = 'trial-run fail'; line.textContent = '✗ ' + a.error; continue; }
      const clean = !a.violations.length && !a.missing.length;
      line.className = 'trial-run ' + (clean ? 'pass' : 'fail');
      line.textContent = clean ? '✓ zero violations, every requirement met'
        : `✗ ${a.weighted} weighted violations · `
          + a.violations.slice(0, 3).map(v => v.id).join(', ')
          + (a.missing.length ? ` · missing ${a.missing[0]}` : '');

      $('tCol_' + side).querySelector('.trial-slot').innerHTML =
        `<div class="trial-run fail">${esc(String(e.message || e))}</div>`;
    }

    + 'front of it.';
}

// ============================================================================
// SCR.story — the thing you actually watch.
//
// One button. Press it and the agent runs: the car laps while it works through
// coding tasks it has never seen. When the run ends, the loop reads its own
// failures, decides which of its components caused them, writes a change to
// that component, checks the change against ten gates, and either keeps it or
// throws it away. Then you press the button again.
//
// Every number on screen came out of the control plane in loop/. Nothing here
// invents a result; this module is a director, not a simulator.
// ============================================================================

  { key: 'AERO',       ui: 'AERO',     name: 'RETRIEVAL',    does: 'context assembly' },
  { key: 'POWER_UNIT', ui: 'POWER',    name: 'MODEL',        does: 'inference' },
  { key: 'TYRES',      ui: 'TYRES',    name: 'SAMPLING',     does: 'decode policy' },
  { key: 'DATA',       ui: 'DATA',     name: 'VERIFICATION', does: 'pre-submit audit' },
  { key: 'SIMULATOR',  ui: 'SIM',      name: 'CURRICULUM',   does: 'task selection' },
  { key: 'ENGINEER',   ui: 'ENGINEER', name: 'PROPOSER',     does: 'patch synthesis' },
];
const SUPPORT = [
  { key: 'STRATEGIST', ui: 'STRATEGY',   name: 'BUDGET',  does: 'stop policy' },
  { key: 'SCRUTINEER', ui: 'COMPLIANCE', name: 'AUDIT',   does: 'tamper check' },
  { key: 'HISTORIAN',  ui: 'HIST',       name: 'MEMORY',  does: 'trace compaction' },
  { key: 'PIT_CREW',   ui: 'TOOLS',      name: 'DEPLOY',  does: 'install and smoke' },
];
const ALL = PARTS.concat(SUPPORT);
const BY_KEY = Object.fromEntries(ALL.map(p => [p.key, p]));
const HUE = { AERO: 'cyan', POWER_UNIT: 'red', TYRES: 'amber', DATA: 'green', SIMULATOR: 'cyan',
  ENGINEER: 'gold', STRATEGIST: 'purple', SCRUTINEER: 'white', HISTORIAN: 'gold', PIT_CREW: 'white' };

// Two phrasings per gate. A gate description only reads correctly in one direction: "an auditor
// found no tampering" is what passing means, and printing it as the reason something failed is
// nonsense. The failure sentence has to be written separately.
const GATE_FAILS = {
  diff_size: 'the change was too small to be a change',
  comparable_ab: 'only one option was written, not two',
  novelty: 'it had already tried this exact change',
  evidence: 'it did not cite the failures that justify the change',
  seesaw: 'it was not better on both the practice briefs and the held-out ones',
  correlation: 'the three measurements disagree with each other',
  regression: 'something that worked before is broken now',
  cost_cap: 'it went over its budget',
  scrutineering: 'the auditor would not clear the change',
  rl_entropy: 'the model collapsed during training',
};

// what each gate means when it passes
const GATE_SAYS = {
  diff_size: 'the change is more than a typo',
  comparable_ab: 'two different options were written, not one',
  novelty: 'this is not a change it already tried',
  evidence: 'it cites the failures that justify the change',
  seesaw: 'faster on practice tasks AND on held-out tasks',
  correlation: 'the three measurements agree with each other',
  regression: 'nothing that worked before is broken now',
  cost_cap: 'it stayed inside its budget',

};

const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
  if (txt !== undefined) n.textContent = txt; return n; };

  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const st = S.state = {

function levelsAt(n) {
  const lv = {}; for (const p of ALL) lv[p.key] = 1;
  for (let k = 0; k < n && k < st.rounds.length; k++) {
    const r = st.rounds[k];
    if (r.promoted && r.role && lv[r.role] !== undefined) lv[r.role]++;
  }

function connectLive() {

function onLive(d) {

      toRun();
      const rc = $('runCount'); if (rc) rc.textContent = `RUN ${d.generation + 1} · LIVE`;
      say(`Run ${d.generation + 1}. The agent is building interfaces on this machine, right now. `
        + 'Each one is written, opened in a real browser, and audited by axe-core.');
      const dash = SCR.dash;
      if (dash) { dash.gatesClear(); dash.verdict('RUNNING', 'live'); dash.pipsFor(live.total);
        dash.clean(0, 0, live.total); dash.delta(null); dash.scoreSub('measuring'); }
      const host = work('THE AGENT IS BUILDING', 'live, on your machine');
      const grid = el('div', 'tasks'); grid.id = 'taskGrid'; host.append(grid);
    } else if (d.phase === 'DIAGNOSE') {

        + 'to find out which one actually caused it.');

    } else if (d.phase === 'GATES') {

      + `<b style="color:var(--${HUE[d.role] || 'cyan'})">${esc(p.name)}</b> corrected: `
      + (d.flipped ? `<span style="color:var(--green)">fixed it, ${fx(d.credit)}s</span>`

// ---------------------------------------------------------------------------------------
// the harness panel

function buildRig() {
  const host = $('rig'); if (!host) return;
  host.textContent = '';
  // Level is drawn as pips rather than written as a number: five slots, filled as the
  // component is upgraded, so a column of these reads as a state of tune at a glance.
  const add = p => {
    const n = el('button', 'part hue-' + (HUE[p.key] || 'cyan'));
    n.dataset.part = p.key;
    n.innerHTML = `<span class="part-top"><b>${esc(p.name)}</b>`
      + `<span class="part-lvl" data-lvl>${'<i></i>'.repeat(MAX_LV)}</span></span>`
      + `<span class="part-does">${esc(p.does)}</span>`
      + '<span class="part-bar"><b data-bar></b></span>';
    n.addEventListener('click', () => focusPart(p.key));
    host.append(n);
  };
  PARTS.forEach(add);
  const sep = el('div', 'rail-head');
  sep.innerHTML = '<span>KEEPING IT HONEST</span>';
  sep.style.marginTop = '6px';
  host.append(sep);
  SUPPORT.forEach(add);
  paintRig();
}

const MAX_LV = 5;

// The heat bar under each component is this run's blame: the share of lost time that
// replaying the run with that one component corrected actually recovered.
function paintHeat(standings) {
  const host = $('rig'); if (!host) return;
  const rows = Object.entries(standings || {});
  const max = Math.max(1, ...rows.map(([, s]) => s.blame_s || 0));
  const worst = rows.sort((a, b) => (b[1].blame_s || 0) - (a[1].blame_s || 0))[0];
  for (const node of host.querySelectorAll('.part')) {
    const k = node.dataset.part;
    const s = (standings || {})[k];
    const bar = node.querySelector('[data-bar]');
    if (bar) bar.style.width = s ? Math.round(100 * (s.blame_s || 0) / max) + '%' : '0%';
    node.classList.toggle('hot', !!worst && k === worst[0] && (worst[1].blame_s || 0) > 0);
  }
}

function paintRig(bumped) {
  const host = $('rig'); if (!host) return;
  for (const node of host.querySelectorAll('.part')) {
    const k = node.dataset.part, lv = st.levels[k] || 1;
    const pips = node.querySelectorAll('[data-lvl] i');
    pips.forEach((pip, i) => { pip.className = i < lv ? 'on' : ''; });
    node.classList.toggle('up', k === bumped);
  }
  const sub = $('rigSub');
  if (sub) {
    const total = Object.values(st.levels).reduce((a, b) => a + b, 0) - ALL.length;
    sub.textContent = total ? `${total} upgrade${total === 1 ? '' : 's'} so far` : 'six components';
  }
}

function focusPart(key) {
  const g = SCR.scenes.garage;
  for (const n of document.querySelectorAll('.part')) n.classList.toggle('sel', n.dataset.part === key);
  if (A.sceneName !== 'garage') showGarage();
  if (g) { const ui = (BY_KEY[key] || {}).ui; g.select(ui); g.setCamera('STATION_' + ui); }
  const p = BY_KEY[key];
  if (p) say(`<b>${esc(p.name)}</b> — ${esc(p.does)}. Level ${st.levels[key] || 1}.`);
}
